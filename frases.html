<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Japonês - Frases</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --text-color: #333; --card-bg: #ffffff;
            --primary-color: #2c3e50; --secondary-color: #34495e;
            --border-color: #dddddd; --highlight-color: #d35400;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e;
            --primary-color: #34495e; --secondary-color: #4b6584;
            --border-color: #333333; --highlight-color: #e67e22;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s; }
        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-menu a { padding: 10px 20px; text-decoration: none; background: var(--primary-color); color: white; border-radius: 5px; font-weight: bold; }
        .nav-menu a.ativo { background: var(--highlight-color); }
        .header-container { display: flex; justify-content: space-between; max-width: 1000px; margin: 0 auto 20px; }
        
        .tools-panel { max-width: 1000px; margin: 0 auto 30px; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: center; gap: 20px; }
        .tool-btn { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .tool-btn.danger { background-color: #c0392b; }
        
        .list-container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .frase-card { background: var(--card-bg); border: 1px solid var(--border-color); border-left: 5px solid var(--highlight-color); border-radius: 8px; padding: 20px; transition: 0.2s; }
        .frase-texto { font-size: 1.8em; margin: 0 0 10px 0; font-weight: 500; }
        .frase-romaji { color: gray; font-size: 0.9em; margin-bottom: 15px; font-family: monospace; }
        
        .termo-link {
            cursor: pointer;
            border-bottom: 2px dotted var(--primary-color);
            transition: 0.2s;
            padding: 0 2px;
        }
        .termo-link:hover {
            color: var(--highlight-color);
            background-color: rgba(230, 126, 34, 0.15);
            border-bottom: 2px solid var(--highlight-color);
        }

        .lacuna { display: inline-block; min-width: 30px; text-align: center; background-color: var(--text-color); color: var(--text-color); border-radius: 3px; cursor: pointer; user-select: none; transition: 0.2s; padding: 0 5px; }
        .lacuna.revelada { background-color: transparent; color: var(--highlight-color); font-weight: bold; border-bottom: 2px solid var(--highlight-color); }

        details { background-color: rgba(0,0,0,0.03); padding: 10px; border-radius: 5px; margin-top: 10px; }
        summary { cursor: pointer; font-weight: bold; outline: none; display: none; }

        /* Estilos de Paginação */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; padding-bottom: 20px; }
        .pagination button { background-color: var(--secondary-color); padding: 8px 15px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .pagination button:disabled { background-color: var(--border-color); color: gray; cursor: not-allowed; opacity: 0.6; }
        .page-info { font-weight: bold; font-size: 1.1em; color: var(--text-color); }
        
        .vocab-sugestao-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
            color: var(--text-color);
        }
        .vocab-sugestao-item:hover {
            background-color: rgba(120, 120, 120, 0.1);
        }
        
        .conjunto-pill {
            padding: 6px 14px;
            border-radius: 20px;
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            color: var(--text-color);
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            display: inline-block;
        }
        .conjunto-pill:hover {
            border-color: var(--highlight-color);
            background-color: rgba(230, 126, 34, 0.05);
        }
        .conjunto-pill.ativo {
            background-color: var(--highlight-color);
            color: white;
            border-color: var(--highlight-color);
        }
    </style>
</head>
<body>

    <script src="vocabulario.js"></script>
    <script src="frases.js"></script>

    <div class="header-container">
        <h1>Módulo 2: Prática e Gramática</h1>
        <button onclick="toggleTheme()" style="padding:5px 10px; cursor:pointer; background:var(--primary-color); color:white; border:none; border-radius:5px; font-weight:bold;">🌙 Tema</button>
    </div>

    <div class="nav-menu">
        <a href="index.html">📚 Vocabulário & Kanji</a>
        <a href="frases.html" class="ativo">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="textos.html">📄 Textos</a>
        <a href="srs.html">🧠 SRS</a>
    </div>

    <div class="tools-panel" style="gap: 15px; flex-wrap: wrap;">
        <button class="tool-btn" id="btnLacunas" onclick="toggleLacunas()">Ativar Teste de Partículas</button>
        <button class="tool-btn danger" onclick="toggleRomaji()">Ocultar/Mostrar Romaji</button>
        <div style="display: flex; align-items: center; gap: 10px; margin-left: auto;">
            <label style="font-weight: bold; font-size: 0.9em; color: var(--text-color);">Conjunto:</label>
            <select id="filtro-conjunto" onchange="mudarConjunto()" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); font-weight: bold; cursor: pointer; outline: none;">
                <option value="Todos">Todos</option>
                <option value="Frase">Frase (Padrão)</option>
            </select>
        </div>
    </div>

    <!-- Painel do Sensei IA para Gerar Frases -->
    <div class="tools-panel" style="flex-direction: column; max-width: 1000px; margin: 0 auto 20px; align-items: stretch; gap: 15px;">
        <h3 style="margin: 0; color: var(--primary-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; user-select: none;" onclick="togglePanelIA()">
            <span>🤖 Gerar Novas Frases com o Sensei IA</span> <span id="ia-panel-arrow">▼</span>
        </h3>
        
        <div id="painel-geracao-ia" style="display: none; flex-direction: column; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 250px;">
                    <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px;">Tema das Frases:</label>
                    <input type="text" id="ia-tema" placeholder="Ex: No aeroporto, Fazendo compras, Falando sobre hobbies..." style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); outline: none;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px;">Conjunto (Categoria):</label>
                    <select id="ia-categoria-select" onchange="toggleNovoConjuntoInput()" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); outline: none; cursor: pointer;">
                        <option value="Frase">Frase (Padrão)</option>
                        <option value="novo">Criar Novo Conjunto...</option>
                    </select>
                </div>
                <div id="ia-novo-conjunto-div" style="flex: 1; min-width: 200px; display: none;">
                    <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px;">Nome do Novo Conjunto:</label>
                    <input type="text" id="ia-novo-conjunto" placeholder="Ex: Viagem" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); outline: none;">
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <label style="font-weight: bold; font-size: 0.95em; color: var(--text-color);">📁 Usar termos dos conjuntos selecionados (Múltipla Escolha):</label>
                <div id="ia-conjuntos-pills" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px;">
                    <!-- Preenchido dinamicamente via JS -->
                </div>
                <div id="ia-termos-selecionados-preview" style="font-size: 0.85em; opacity: 0.8; margin-top: 4px; color: gray; font-style: italic;">
                    Nenhum conjunto selecionado. O Sensei criará frases livres.
                </div>
            </div>
            
            <button class="tool-btn" onclick="gerarFrasesIA()" style="width: 100%;">🤖 Gerar Frases</button>
            
            <!-- Pré-visualização das frases geradas -->
            <div id="preview-geracao" style="display: none; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 5px; border: 1px dashed var(--border-color);">
                <h4 style="margin: 0 0 10px 0;">Pré-visualização das Frases Geradas:</h4>
                <div id="preview-lista" style="display: flex; flex-direction: column; gap: 10px;"></div>
                <button class="tool-btn" id="btn-salvar-geradas" onclick="salvarFrasesGeradas()" style="background-color: #27ae60; margin-top: 10px; width: 100%;">📥 Salvar no meu Banco</button>
            </div>
        </div>
    </div>

    <div class="list-container" id="frases-container"></div>

    <div class="pagination" id="pagination-controls"></div>

    <script>
        // Cole este bloco no início da tag <script> das suas páginas para controlar o login:
        const sessaoLocalStorage = localStorage.getItem('supabase_session');
        if (!sessaoLocalStorage) {
            window.location.href = "login.html"; // Redireciona se não tiver logado
        } else if (!localStorage.getItem('ia_preference')) {
            window.location.href = "setup.html"; // Força setup da IA
        }
        const sessao = JSON.parse(sessaoLocalStorage);
        const tokenDeAcesso = `Bearer ${sessao.access_token}`;
        const idDoUsuarioLogado = sessao.user.id;
        if (localStorage.getItem('tema') === 'dark') document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.toggleAttribute('data-theme', !isDark);
            localStorage.setItem('tema', isDark ? 'light' : 'dark');
        }

        let modoTesteAtivo = false;
        let romajiOculto = false;
        
        // Configurações de Paginação
        let currentPage = 1;
        const itemsPerPage = 5; // Limite de 5 frases por página

        let frasesCombinadas = [];
        let frasesFiltradas = [];
        let categoriasDeFrases = ['Todos', 'Frase']; // Lista dinâmica de categorias
        let frasesGeradasTemporarias = [];
        let termosDeVocabulario = [];
        let conjuntosDeVocabulario = [];
        let conjuntosSelecionadosParaGeracao = [];

        function extrairConjuntosDeTermo(notas) {
            let conjuntos = [];
            if (notas) {
                const match = notas.match(/\[Conjuntos:\s*([^\]]+)\]/);
                if (match) {
                    conjuntos = match[1].split(',').map(s => s.trim()).filter(s => s.length > 0);
                }
            }
            if (!conjuntos.includes('Geral')) {
                conjuntos.unshift('Geral');
            }
            return conjuntos;
        }

        function renderizarPillsConjuntos() {
            const container = document.getElementById('ia-conjuntos-pills');
            if (!container) return;

            if (conjuntosDeVocabulario.length === 0) {
                container.innerHTML = `<span style="color: gray; font-style: italic;">Nenhum conjunto de vocabulário encontrado.</span>`;
                return;
            }

            container.innerHTML = conjuntosDeVocabulario.map(conj => {
                const ativo = conjuntosSelecionadosParaGeracao.includes(conj);
                return `<div class="conjunto-pill ${ativo ? 'ativo' : ''}" onclick="toggleConjuntoSelecao('${conj.replace(/'/g, "\\'")}')">${conj}</div>`;
            }).join('');
        }

        function toggleConjuntoSelecao(conjunto) {
            const index = conjuntosSelecionadosParaGeracao.indexOf(conjunto);
            if (index === -1) {
                conjuntosSelecionadosParaGeracao.push(conjunto);
            } else {
                conjuntosSelecionadosParaGeracao.splice(index, 1);
            }
            
            renderizarPillsConjuntos();
            atualizarPreviewTermosSelecionados();
        }

        function obterTermosDosConjuntosSelecionados() {
            if (conjuntosSelecionadosParaGeracao.length === 0) {
                return [];
            }
            return termosDeVocabulario.filter(t => {
                const sets = extrairConjuntosDeTermo(t.notas);
                return conjuntosSelecionadosParaGeracao.some(sel => sets.includes(sel));
            });
        }

        function atualizarPreviewTermosSelecionados() {
            const container = document.getElementById('ia-termos-selecionados-preview');
            if (!container) return;

            const termos = obterTermosDosConjuntosSelecionados();
            if (conjuntosSelecionadosParaGeracao.length === 0) {
                container.textContent = 'Nenhum conjunto selecionado. O Sensei criará frases livres.';
                container.style.color = 'gray';
            } else {
                container.textContent = `✓ ${termos.length} termo(s) do vocabulário selecionado(s) a partir de: ${conjuntosSelecionadosParaGeracao.join(', ')}.`;
                container.style.color = 'var(--highlight-color)';
            }
        }

        async function carregarFrasesDinamicas() {
            try {
                const response = await fetch('/api/jisho?acao=listar', {
                    headers: { "Authorization": tokenDeAcesso }
                });
                const resultado = await response.json();

                // Trava automática de JWT expirado
                if (resultado && resultado.code === "PGRST303") {
                    console.warn("Sessão expirada. Redirecionando para o login...");
                    localStorage.removeItem('supabase_session');
                    window.location.href = "login.html";
                    return;
                }

                let dadosDb = [];
                if (Array.isArray(resultado)) {
                    dadosDb = resultado;
                }

                // Filtrar os dados dinâmicos: apenas categorias que começam com "Frase"
                const frasesDb = dadosDb.filter(d => d && d.item && (d.categoria === 'Frase' || (d.categoria && d.categoria.startsWith('Frase:'))));

                // Evitar duplicados com as estáticas base (frasesPraticas de frases.js)
                const itensExistentes = new Set(frasesPraticas.map(d => d.item));
                const frasesDbFiltradas = frasesDb.filter(d => !itensExistentes.has(d.item));

                frasesCombinadas = [...frasesPraticas, ...frasesDbFiltradas];
                
                // Atualizar lista de categorias disponíveis
                const sets = new Set(['Todos', 'Frase']);
                frasesCombinadas.forEach(f => {
                    if (f.categoria && f.categoria.startsWith('Frase:')) {
                        sets.add(f.categoria);
                    }
                });
                categoriasDeFrases = Array.from(sets);

                // Preencher a lista de termos de vocabulário para seleção (unindo banco de dados e dadosRevisao local)
                const termosDb = dadosDb.filter(d => d && d.item && d.categoria !== 'Texto' && !(d.categoria && d.categoria.startsWith('Frase')));
                const itensExistentesVocab = new Set(termosDb.map(d => d.item));
                const baseRevisaoFiltrados = (typeof dadosRevisao !== 'undefined' ? dadosRevisao : []).filter(d => !itensExistentesVocab.has(d.item));
                termosDeVocabulario = [...baseRevisaoFiltrados, ...termosDb];

                // Descobrir conjuntos de vocabulário disponíveis
                const conjuntosVocabSet = new Set(['Geral']);
                termosDeVocabulario.forEach(t => {
                    const conjuntos = extrairConjuntosDeTermo(t.notas);
                    conjuntos.forEach(c => conjuntosVocabSet.add(c));
                });
                conjuntosDeVocabulario = Array.from(conjuntosVocabSet);

                renderizarPillsConjuntos();
                atualizarPreviewTermosSelecionados();

                // Preencher seletores HTML
                atualizarSeletoresDeCategoria();

            } catch (e) {
                console.error("Falha ao carregar frases dinâmicas.", e);
                frasesCombinadas = [...frasesPraticas];
            }

            aplicarFiltroConjunto();
        }

        function atualizarSeletoresDeCategoria() {
            const filtroSelect = document.getElementById('filtro-conjunto');
            const currentFiltroVal = filtroSelect.value;
            
            // Preenche o filtro principal
            filtroSelect.innerHTML = categoriasDeFrases.map(cat => {
                const label = cat === 'Todos' ? 'Todos' : (cat === 'Frase' ? 'Frase (Padrão)' : cat.replace('Frase: ', ''));
                return `<option value="${cat}">${label}</option>`;
            }).join('');
            
            // Tenta manter o valor selecionado se ainda existir
            if (categoriasDeFrases.includes(currentFiltroVal)) {
                filtroSelect.value = currentFiltroVal;
            } else {
                filtroSelect.value = 'Todos';
            }

            // Preenche o select do painel de IA
            const iaSelect = document.getElementById('ia-categoria-select');
            const options = categoriasDeFrases
                .filter(cat => cat !== 'Todos')
                .map(cat => {
                    const label = cat === 'Frase' ? 'Frase (Padrão)' : cat.replace('Frase: ', '');
                    return `<option value="${cat}">${label}</option>`;
                });
            options.push(`<option value="novo">Criar Novo Conjunto...</option>`);
            iaSelect.innerHTML = options.join('');
        }

        function aplicarFiltroConjunto() {
            const filtroVal = document.getElementById('filtro-conjunto').value;
            if (filtroVal === 'Todos') {
                frasesFiltradas = frasesCombinadas;
            } else {
                frasesFiltradas = frasesCombinadas.filter(f => f.categoria === filtroVal);
            }
            currentPage = 1;
            renderizarPagina();
        }

        function mudarConjunto() {
            aplicarFiltroConjunto();
        }

        function togglePanelIA() {
            const panel = document.getElementById('painel-geracao-ia');
            const arrow = document.getElementById('ia-panel-arrow');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'flex';
                arrow.textContent = '▲';
            } else {
                panel.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        function toggleNovoConjuntoInput() {
            const select = document.getElementById('ia-categoria-select');
            const divNovo = document.getElementById('ia-novo-conjunto-div');
            if (select.value === 'novo') {
                divNovo.style.display = 'block';
                document.getElementById('ia-novo-conjunto').focus();
            } else {
                divNovo.style.display = 'none';
            }
        }

        async function gerarFrasesIA() {
            const tema = document.getElementById('ia-tema').value.trim();
            const termosSelecionados = obterTermosDosConjuntosSelecionados();

            if (!tema && termosSelecionados.length === 0) {
                alert("Por favor, digite um tema ou selecione ao menos um conjunto do vocabulário.");
                return;
            }

            const btn = document.querySelector('button[onclick="gerarFrasesIA()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '🤖 Gerando frases estruturadas...';
            btn.disabled = true;

            const preview = document.getElementById('preview-geracao');
            const previewLista = document.getElementById('preview-lista');
            preview.style.display = 'none';
            previewLista.innerHTML = '';

            try {
                const apiKey = localStorage.getItem('gemini_api_key');
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) {
                    headers['X-Gemini-Key'] = apiKey;
                }

                let prompt = '';
                if (tema) {
                    prompt = `Gere exatamente 3 frases úteis e práticas em japonês sobre o tema: "${tema}".`;
                } else {
                    prompt = `Gere exatamente 3 frases úteis e práticas em japonês utilizando e focando nos termos de vocabulário fornecidos pelo usuário.`;
                }

                prompt += `
Retorne a resposta estritamente no formato de uma array JSON (sem formatação markdown, sem blocos de código \`\`\`json, apenas a array JSON direta).
Cada objeto da array deve conter exatamente estas 4 chaves:
- "item": a frase escrita em japonês (com kanji/kana).
- "leitura": a leitura/transliteração em Romaji.
- "significado": a tradução exata em português.
- "notas": uma breve nota gramatical contendo a análise da frase e a identificação dos blocos/palavras utilizados nela no formato exato: "Blocos usados: [bloco1] + [bloco2] + ...". Exemplo: "Blocos usados: 私 + は + 学生 + です."`;

                if (termosSelecionados.length > 0) {
                    const termosListaStr = termosSelecionados.map(t => `"${t.item}" (${t.significado})`).join(', ');
                    prompt += `\n\nREQUISITO CRÍTICO: As frases geradas devem ser compostas e formadas obrigatoriamente utilizando EXCLUSIVAMENTE os seguintes termos de vocabulário do usuário: ${termosListaStr}. O Sensei IA deve construir frases combinando esses termos selecionados com partículas, verbos de ligação e estruturas simples adequadas para manter as frases naturais e corretas, mas sem adicionar novas palavras que não estejam listadas.`;
                }

                prompt += `\n\nSiga o formato estrito JSON.`;

                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        messages: [
                            { role: 'user', parts: [{ text: prompt }] }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro do servidor');

                let jsonText = data.reply.trim();
                
                if (jsonText.startsWith('```json')) {
                    jsonText = jsonText.substring(7);
                }
                if (jsonText.startsWith('```')) {
                    jsonText = jsonText.substring(3);
                }
                if (jsonText.endsWith('```')) {
                    jsonText = jsonText.substring(0, jsonText.length - 3);
                }
                jsonText = jsonText.trim();

                const arrayFrases = JSON.parse(jsonText);
                if (!Array.isArray(arrayFrases)) throw new Error('A resposta não é uma lista de frases válida.');

                frasesGeradasTemporarias = arrayFrases;

                previewLista.innerHTML = arrayFrases.map((f, index) => `
                    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 5px; padding: 12px; display: flex; gap: 10px; align-items: start; text-align: left;">
                        <input type="checkbox" id="chk-frase-${index}" checked style="margin-top: 5px; transform: scale(1.2);">
                        <div style="flex-grow:1;">
                            <p style="font-size: 1.4em; margin: 0 0 5px 0; font-weight: bold;">${f.item}</p>
                            <p style="color: gray; font-size: 0.85em; font-family: monospace; margin: 0 0 5px 0;">${f.leitura}</p>
                            <p style="color: var(--highlight-color); font-weight: bold; margin: 0 0 5px 0;">${f.significado}</p>
                            <p style="font-size: 0.85em; opacity: 0.8; margin: 0;">${f.notas}</p>
                        </div>
                    </div>
                `).join('');

                preview.style.display = 'flex';

            } catch (e) {
                console.error(e);
                alert("Erro ao gerar frases. Verifique se o tema é adequado ou tente novamente.\nDetalhes: " + e.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function salvarFrasesGeradas() {
            const checkboxes = frasesGeradasTemporarias.map((_, i) => document.getElementById(`chk-frase-${i}`));
            const selecionadas = frasesGeradasTemporarias.filter((_, i) => checkboxes[i] && checkboxes[i].checked);

            if (selecionadas.length === 0) {
                alert("Nenhuma frase selecionada para salvar.");
                return;
            }

            const selectCat = document.getElementById('ia-categoria-select');
            let categoriaFinal = selectCat.value;
            
            if (categoriaFinal === 'novo') {
                const nomeNovo = document.getElementById('ia-novo-conjunto').value.trim();
                if (!nomeNovo) {
                    alert("Por favor, digite o nome do novo conjunto.");
                    return;
                }
                categoriaFinal = nomeNovo.startsWith('Frase:') ? nomeNovo : `Frase: ${nomeNovo}`;
            }

            const btn = document.getElementById('btn-salvar-geradas');
            btn.innerHTML = '⏳ Salvando frases no banco...';
            btn.disabled = true;

            try {
                for (let frase of selecionadas) {
                    const novoTermo = {
                        item: frase.item,
                        leitura: frase.leitura,
                        significado: frase.significado,
                        categoria: categoriaFinal,
                        notas: frase.notas,
                        user_id: idDoUsuarioLogado
                    };

                    const response = await fetch('/api/jisho?acao=salvar', {
                        method: 'POST',
                        headers: {
                            "Authorization": tokenDeAcesso,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(novoTermo)
                    });

                    if (!response.ok) throw new Error("Erro ao salvar no banco");
                }

                alert(`${selecionadas.length} frase(s) salva(s) com sucesso no conjunto "${categoriaFinal.replace('Frase: ', '')}"!`);
                
                document.getElementById('ia-tema').value = '';
                document.getElementById('ia-novo-conjunto').value = '';
                document.getElementById('ia-categoria-select').value = 'Frase';
                toggleNovoConjuntoInput();
                document.getElementById('preview-geracao').style.display = 'none';
                
                await carregarFrasesDinamicas();

            } catch (e) {
                console.error(e);
                alert("Ocorreu um erro ao salvar as frases. Tente novamente.");
            } finally {
                btn.innerHTML = '📥 Salvar no meu Banco';
                btn.disabled = false;
            }
        }

        function toggleLacunas() {
            modoTesteAtivo = !modoTesteAtivo;
            document.getElementById('btnLacunas').textContent = modoTesteAtivo ? "Desativar Teste" : "Ativar Teste de Partículas";
            document.getElementById('btnLacunas').style.backgroundColor = modoTesteAtivo ? "#e67e22" : "#27ae60";
            renderizarPagina();
        }

        function toggleRomaji() {
            romajiOculto = !romajiOculto;
            renderizarPagina();
        }

        function irParaTermo(termo, event) {
            event.stopPropagation();
            window.location.href = `index.html?termo=${encodeURIComponent(termo)}`;
        }

        function revelarLacuna(elemento, particula, event) {
            event.stopPropagation();
            elemento.textContent = particula;
            elemento.classList.add('revelada');
            elemento.onclick = (e) => irParaTermo(particula, e);
        }

        function processarTextoComBlocos(textoOriginal, notas) {
            let match = notas.match(/Blocos usados:\s*(.+?)\./);
            if (!match) return textoOriginal;
            
            let blocos = match[1].split(/\s*\+\s*/);
            let resultado = "";
            let restante = textoOriginal;

            for (let bloco of blocos) {
                let index = restante.indexOf(bloco);
                if (index !== -1) {
                    resultado += restante.substring(0, index);
                    
                    if (modoTesteAtivo && /^[はをがのかね]$/.test(bloco)) {
                        resultado += `<span class="lacuna" onclick="revelarLacuna(this, '${bloco}', event)">_</span>`;
                    } else {
                        resultado += `<span class="termo-link" onclick="irParaTermo('${bloco}', event)">${bloco}</span>`;
                    }
                    restante = restante.substring(index + bloco.length);
                }
            }
            resultado += restante;
            return resultado;
        }

        function renderizarPagina() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const frasesPagina = frasesFiltradas.slice(startIndex, endIndex);

            const container = document.getElementById('frases-container');
            if (frasesPagina.length === 0) {
                container.innerHTML = `<p style="text-align:center;">Nenhuma frase encontrada neste conjunto.</p>`;
                return;
            }

            container.innerHTML = frasesPagina.map(d => `
                <div class="frase-card" onclick="const det = this.querySelector('details'); det.open = !det.open;" style="cursor: pointer;">
                    <p class="frase-texto">${processarTextoComBlocos(d.item, d.notas)}</p>
                    <p class="frase-romaji" style="display: ${romajiOculto ? 'none' : 'block'}; pointer-events: none;">${d.leitura}</p>
                    <details onclick="event.stopPropagation();">
                        <summary>Significado e Análise</summary>
                        <p style="color:var(--highlight-color); font-weight:bold; margin-top:5px;">${d.significado}</p>
                        <p style="font-size:0.9em;">${d.notas}</p>
                        ${d.id ? `<button style="margin-top: 8px; width: 100%; font-size: 0.9em; background-color: #c0392b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="event.stopPropagation(); excluirFraseDoCard('${d.id}', '${d.item.replace(/'/g, "\\'")}')">🗑️ Excluir Frase</button>` : ''}
                    </details>
                </div>
            `).join('');

            renderizarControlesPaginacao();
        }

        async function excluirFraseDoCard(id, item) {
            if (!confirm(`Tem certeza que deseja excluir a frase "${item}"?`)) {
                return;
            }
            try {
                const response = await fetch(`/api/jisho?acao=deletar&id=${id}`, {
                    method: 'DELETE',
                    headers: {
                        "Authorization": tokenDeAcesso
                    }
                });

                if (response.ok) {
                    alert("Frase excluída com sucesso!");
                    await carregarFrasesDinamicas();
                } else {
                    const err = await response.json();
                    alert("Erro ao excluir: " + (err.error || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error("Erro ao excluir frase:", error);
                alert("Erro interno ao tentar excluir.");
            }
        }

        function renderizarControlesPaginacao() {
            const container = document.getElementById('pagination-controls');
            const totalPages = Math.ceil(frasesFiltradas.length / itemsPerPage);
            
            if (totalPages <= 1) {
                container.innerHTML = ''; 
                return;
            }

            container.innerHTML = `
                <button onclick="mudarPagina(-1)" ${currentPage === 1 ? 'disabled' : ''}>◄ Anterior</button>
                <span class="page-info">Página ${currentPage} de ${totalPages}</span>
                <button onclick="mudarPagina(1)" ${currentPage === totalPages ? 'disabled' : ''}>Próxima ►</button>
            `;
        }

        function mudarPagina(direcao) {
            currentPage += direcao;
            renderizarPagina();
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        // Inicialização
        window.addEventListener('DOMContentLoaded', carregarFrasesDinamicas);
    </script>
</body>
</html>
