<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Japonês - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5; --text-color: #2c3e50; --card-bg: rgba(255, 255, 255, 0.95);
            --primary-color: #2c3e50; --secondary-color: #34495e;
            --border-color: rgba(0, 0, 0, 0.06); --highlight-color: #e67e22;
            --shadow-subtle: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --card-radius: 16px;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #f0f0f0; --card-bg: rgba(30, 30, 30, 0.85);
            --primary-color: #2c3e50; --secondary-color: #4b6584;
            --border-color: rgba(255, 255, 255, 0.08); --highlight-color: #d35400;
            --shadow-subtle: 0 4px 15px rgba(0,0,0,0.3);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.5);
        }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-menu a { padding: 10px 20px; text-decoration: none; background: var(--primary-color); color: white; border-radius: 8px; font-weight: 600; letter-spacing: 0.5px; transition: 0.2s; }
        .nav-menu a:hover { transform: translateY(-2px); opacity: 0.9; }
        .nav-menu a.ativo { background: var(--highlight-color); }
        .header-container { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto 20px; align-items: center; }
        .header-container h1 { font-weight: 700; letter-spacing: -0.5px; margin: 0; }
        button { padding: 10px 16px; border: none; background: var(--primary-color); color: white; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .card-perfil { background: var(--card-bg); padding: 40px; border-radius: var(--card-radius); border: 1px solid var(--border-color); max-width: 600px; margin: 0 auto 20px; text-align: center; box-shadow: var(--shadow-subtle); backdrop-filter: blur(10px); }
        .info-label { font-size: 0.9em; color: gray; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .info-value { font-size: 1.2em; font-weight: bold; color: var(--primary-color); margin-bottom: 30px; }
        [data-theme="dark"] .info-value { color: var(--text-color); }
        .btn-logout { background-color: var(--secondary-color); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; transition: 0.2s; margin-bottom: 15px; width: 100%; max-width: 300px; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; transition: 0.2s; width: 100%; max-width: 300px; }
        .btn-logout:hover, .btn-delete:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Estilos do painel de estatísticas */
        .stats-bar-bg {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        [data-theme="dark"] .stats-bar-bg {
            background: rgba(255, 255, 255, 0.1);
        }
        .stats-bar-fill {
            height: 100%;
            border-radius: 8px;
            width: 0%; /* Animado via JS */
            transition: width 1s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .category-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
            font-weight: 600;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="header-container">
        <h1>Sua Conta</h1>
        <button onclick="toggleTheme()" id="themeBtn" style="padding:5px 10px; cursor:pointer;">🌙 Tema</button>
    </div>

    <div class="nav-menu">
        <a href="index.html">📚 Vocabulário & Kanji</a>
        <a href="frases.html">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="quiz.html">⚡ Quiz</a>
        <a href="textos.html">📄 Textos</a>
        <a href="srs.html">🧠 SRS</a>
        <a href="perfil.html" class="ativo">👤 Perfil</a>
    </div>

    <div class="card-perfil">
        <h2>Área do Usuário</h2>
        <div class="info-label">E-mail Cadastrado:</div>
        <div class="info-value" id="user-email">Carregando...</div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <button class="btn-logout" onclick="fazerLogout()">Sair (Logout)</button>
            <button class="btn-delete" onclick="deletarConta()">Deletar Conta Definitivamente</button>
        </div>
    </div>

    <div class="card-perfil">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">📊 Estatísticas de Estudo</h2>
            <select id="filtro-stats-jlpt" onchange="mudarFiltroEstatisticas()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-weight: bold; cursor: pointer;">
                <option value="Todos">Todos os Níveis</option>
                <option value="N5">Nível N5</option>
                <option value="N4">Nível N4</option>
                <option value="N3">Nível N3</option>
                <option value="N2">Nível N2</option>
                <option value="N1">Nível N1</option>
            </select>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px;">
            <div style="background: rgba(39, 174, 96, 0.1); padding: 15px 30px; border-radius: 12px; border: 1px solid rgba(39, 174, 96, 0.2); min-width: 150px;">
                <div class="info-label" style="margin: 0; color: #27ae60;">Total de Palavras</div>
                <div id="stats-total" style="font-size: 2.5em; font-weight: 800; color: #27ae60; margin-top: 5px;">0</div>
            </div>
        </div>
        
        <div id="stats-categories-container" style="display: flex; flex-direction: column; gap: 15px; text-align: left; max-width: 450px; margin: 0 auto;">
            <p style="text-align: center; opacity: 0.7;">Carregando estatísticas...</p>
        </div>
    </div>

    <div class="card-perfil">
        <h2>🏆 Caminho do JLPT</h2>
        <div id="stats-jlpt-container" style="display: flex; flex-direction: column; gap: 15px; text-align: left; max-width: 450px; margin: 0 auto;">
            <p style="text-align: center; opacity: 0.7;">Carregando níveis JLPT...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://sodqxkvkxifczfscbxwo.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_qanav-1ayeNA40f692w2Xg_qqGnFcuG";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Tema
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        const coresCategorias = {
            'Kanji': '#9b59b6',
            'Verbo': '#e74c3c',
            'Partícula': '#3498db',
            'Demonstrativo': '#f1c40f',
            'Vocabulário': '#2ecc71',
            'Outros': '#95a5a6'
        };

        async function carregarPerfil() {
            const sessao = localStorage.getItem('supabase_session');
            if (!sessao) {
                window.location.href = "login.html";
                return;
            }
            const parsedSession = JSON.parse(sessao);
            document.getElementById('user-email').innerText = parsedSession.user.email;
            
            // Carrega Estatísticas
            await carregarEstatisticas(parsedSession.user.id);
        }

        let dadosVocabularioPerfil = [];

        async function carregarEstatisticas(userId) {
            const container = document.getElementById('stats-categories-container');
            const containerJLPT = document.getElementById('stats-jlpt-container');
            try {
                const sessao = localStorage.getItem('supabase_session');
                const parsedSession = JSON.parse(sessao);
                const tokenDeAcesso = `Bearer ${parsedSession.access_token}`;

                const response = await fetch('/api/jisho?acao=listar', {
                    headers: { "Authorization": tokenDeAcesso }
                });

                if (!response.ok) throw new Error("Erro ao buscar dados da API.");
                dadosVocabularioPerfil = await response.json();
                
                renderizarStatsCategorias("Todos");
                renderizarCaminhoJLPT(dadosVocabularioPerfil, containerJLPT);
                
            } catch (err) {
                console.error("Erro ao carregar estatísticas:", err);
                if (container) container.innerHTML = `<p style="text-align: center; color: #e74c3c;">Erro ao carregar estatísticas de estudo.</p>`;
                if (containerJLPT) containerJLPT.innerHTML = `<p style="text-align: center; color: #e74c3c;">Erro ao carregar dados do JLPT.</p>`;
            }
        }

        function mudarFiltroEstatisticas() {
            const nivel = document.getElementById('filtro-stats-jlpt').value;
            renderizarStatsCategorias(nivel);
        }

        function renderizarStatsCategorias(nivel) {
            const container = document.getElementById('stats-categories-container');
            const dataFiltrada = nivel === "Todos" ? dadosVocabularioPerfil : dadosVocabularioPerfil.filter(d => d.jlpt === nivel);
            
            const total = dataFiltrada.length;
            document.getElementById('stats-total').innerText = total;

            if (total === 0) {
                container.innerHTML = `<p style="text-align: center; opacity: 0.7;">Nenhum termo encontrado.</p>`;
                return;
            }

            const contagem = {};
            dataFiltrada.forEach(item => {
                const cat = item.categoria || 'Outros';
                contagem[cat] = (contagem[cat] || 0) + 1;
            });

            let html = '';
            const sortedCategories = Object.entries(contagem).sort((a, b) => b[1] - a[1]);

            sortedCategories.forEach(([cat, qtd]) => {
                const porcentagem = ((qtd / total) * 100).toFixed(0);
                const cor = coresCategorias[cat] || coresCategorias['Outros'];
                
                html += `
                    <div>
                        <div class="category-row">
                            <span>${cat}</span>
                            <span style="color: ${cor};">${qtd} (${porcentagem}%)</span>
                        </div>
                        <div class="stats-bar-bg">
                            <div class="stats-bar-fill" style="background-color: ${cor}; width: ${porcentagem}%;"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderizarCaminhoJLPT(data, containerJLPT) {
            const contagemJLPT = { 'N5': 0, 'N4': 0, 'N3': 0, 'N2': 0, 'N1': 0 };
            data.forEach(item => {
                if (item.jlpt && contagemJLPT[item.jlpt] !== undefined) {
                    contagemJLPT[item.jlpt]++;
                }
            });

            const coresJLPT = {
                'N5': '#27ae60',
                'N4': '#2980b9',
                'N3': '#f39c12',
                'N2': '#e67e22',
                'N1': '#c0392b'
            };
            
            const metasJLPT = {
                'N5': 800,   
                'N4': 700,   
                'N3': 1500,  
                'N2': 3000,  
                'N1': 4000   
            };
            
            let htmlJLPT = '';

            ['N5', 'N4', 'N3', 'N2', 'N1'].forEach(nivel => {
                const qtd = contagemJLPT[nivel];
                const meta = metasJLPT[nivel];
                
                let porcentagem = ((qtd / meta) * 100).toFixed(1);
                if (porcentagem > 100) porcentagem = 100;
                
                const faltam = meta - qtd;
                const textoFaltam = faltam > 0 ? `<span style="font-size: 0.85em; opacity: 0.7; font-weight: normal; margin-left: 8px;">(Faltam ${faltam})</span>` : `<span style="font-size: 0.85em; color: ${coresJLPT[nivel]}; margin-left: 8px;">(Completo! 🎉)</span>`;
                const cor = coresJLPT[nivel];
                
                htmlJLPT += `
                    <div style="margin-bottom: 8px;">
                        <div class="category-row" style="margin-bottom: 4px;">
                            <span>${nivel} ${textoFaltam}</span>
                            <span style="color: ${cor};">${qtd} / ${meta}</span>
                        </div>
                        <div class="stats-bar-bg" style="height: 12px;">
                            <div class="stats-bar-fill" style="background-color: ${cor}; width: ${porcentagem}%;"></div>
                        </div>
                    </div>
                `;
            });
            
            containerJLPT.innerHTML = htmlJLPT;
        }

        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('supabase_session');
            window.location.href = "login.html";
        }

        async function deletarConta() {
            const confirmacao = confirm("ATENÇÃO: Tem certeza de que deseja EXCLUIR SUA CONTA DEFINITIVAMENTE?\nIsso apagará todos os seus dados e não poderá ser desfeito.");
            
            if (confirmacao) {
                const { data, error } = await supabaseClient.rpc('delete_user_account');
                
                if (error) {
                    alert("Erro ao excluir conta: " + error.message);
                } else {
                    alert("Conta excluída com sucesso.");
                    await supabaseClient.auth.signOut();
                    localStorage.removeItem('supabase_session');
                    window.location.href = "login.html";
                }
            }
        }

        carregarPerfil();
    </script>
</body>
</html>
