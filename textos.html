<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Japonês - Leitura de Textos</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --border-color: #dddddd;
            --learned-color: #2980b9;
            --unlearned-color: #c0392b;
            --nav-bg: #2c3e50;
            --nav-active: #e67e22;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #e0e0e0;
            --border-color: #333333;
            --learned-color: #3498db;
            --unlearned-color: #e74c3c;
            --nav-bg: #34495e;
            --nav-active: #e67e22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-menu a {
            padding: 10px 20px;
            text-decoration: none;
            background: var(--nav-bg);
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .nav-menu a.ativo {
            background: var(--nav-active);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto 20px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        @media (max-width: 800px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .painel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            font-size: 1em;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-processar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-processar:hover {
            background-color: #219653;
        }

        .area-leitura {
            margin-top: 20px;
            line-height: 2;
            font-size: 1.4em;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .linha-texto {
            margin: 0;
            display: inline-block;
        }

        .bloco-linha {
            margin: 0 0 12px 0;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .btn-traduzir-linha {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.75em;
            opacity: 0.5;
            padding: 2px 6px;
            margin-left: 8px;
            color: var(--highlight-color);
            border-radius: 4px;
            transition: 0.2s;
            vertical-align: middle;
        }
        .btn-traduzir-linha:hover {
            opacity: 1;
            background-color: rgba(230, 126, 34, 0.15);
        }
        .traducao-container {
            font-size: 0.8em;
            color: var(--learned-color);
            font-style: italic;
            margin-top: 6px;
            padding: 6px 10px;
            background-color: rgba(41, 128, 185, 0.05);
            border-left: 3px solid var(--learned-color);
            border-radius: 3px;
            line-height: 1.4;
        }

        .termo-destaque {
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
            transition: 0.2s;
            border-radius: 3px;
        }

        .termo-destaque.aprendido {
            color: var(--primary-color);
            border-bottom: 2px solid var(--learned-color);
            background-color: rgba(41, 128, 185, 0.1);
        }

        .termo-destaque.aprendido:hover,
        .termo-destaque.aprendido.ativo {
            background-color: var(--learned-color);
            color: white;
            border-color: transparent;
        }

        .termo-destaque.desconhecido {
            color: var(--primary-color);
            border-bottom: 2px solid var(--unlearned-color);
            background-color: rgba(192, 57, 43, 0.1);
        }

        .termo-destaque.desconhecido:hover,
        .termo-destaque.desconhecido.ativo {
            background-color: var(--unlearned-color);
            color: white;
            border-color: transparent;
        }

        .painel-dicionario {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dic-vazio {
            text-align: center;
            color: gray;
            font-style: italic;
            margin-top: 20px;
        }

        .dic-categoria {
            font-size: 0.8em;
            font-weight: bold;
            color: gray;
            text-transform: uppercase;
        }

        .dic-termo {
            font-size: 3em;
            margin: 0;
            text-align: center;
        }

        .dic-leitura {
            font-size: 1.2em;
            color: gray;
            font-family: monospace;
            text-align: center;
        }

        .dic-significado {
            font-size: 1.5em;
            color: var(--learned-color);
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .dic-notas {
            font-size: 0.9em;
            line-height: 1.5;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn-ver-card {
            background-color: var(--learned-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            display: block;
        }

        .btn-ver-card.externo {
            background-color: var(--unlearned-color);
        }

        .btn-salvar-db {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>Módulo 4: Leitura de Textos</h1>
        <button onclick="toggleTheme()"
            style="padding:5px 10px; cursor:pointer; background:#2c3e50; color:white; border:none; border-radius:5px; font-weight:bold;">🌙
            Tema</button>
    </div>

    <div class="nav-menu">
        <a href="index.html">📚 Vocabulário & Kanji</a>
        <a href="frases.html">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="textos.html" class="ativo">📄 Textos</a>
    </div>

    <div class="layout-grid">
        <div class="painel">
            <h3>Inserir Texto em Japonês</h3>
            <input type="text" id="titulo-texto" placeholder="Nome do texto..." style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color);">
            <textarea id="input-texto" placeholder="Cole aqui a letra de uma música..." maxlength="600" oninput="atualizarContador()"></textarea>
            <div style="text-align: right; font-size: 0.8em; color: gray; margin-bottom: 10px;" id="char-counter">0/600</div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-processar" onclick="processarTexto()">Processar Texto</button>
                <button class="btn-processar" style="background-color: var(--primary-color);" onclick="salvarTextoCompleto()">Salvar Texto</button>
            </div>
            
            <div class="area-leitura" id="output-texto"></div>
        </div>

        <div class="painel painel-dicionario">
            <h3>Dicionário</h3>
            <div id="dic-conteudo">
                <p class="dic-vazio">Clique em um termo destacado no texto para ver os detalhes.</p>
            </div>
        </div>
    </div>

    <div class="layout-grid" style="margin-top: 20px; grid-template-columns: 1fr;">
        <div class="painel">
            <h3>Textos Salvos</h3>
            <div id="lista-textos-salvos" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: gray; text-align: center;">Carregando textos...</p>
            </div>
        </div>
    </div>

    <script>
        // --- CONTROLE DE LOGIN OBRIGATÓRIO ---
        const sessaoLocalStorage = localStorage.getItem('supabase_session');
        if (!sessaoLocalStorage) {
            window.location.href = "login.html"; // Redireciona se não tiver logado
        }
        const sessao = JSON.parse(sessaoLocalStorage);
        const tokenDeAcesso = `Bearer ${sessao.access_token}`;
        const idDoUsuarioLogado = sessao.user.id;

        if (localStorage.getItem('tema') === 'dark') document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.toggleAttribute('data-theme', !isDark);
            localStorage.setItem('tema', isDark ? 'light' : 'dark');
        }

        let bancoDadosDinamico = [];
        const segmentador = new Intl.Segmenter('ja-JP', { granularity: 'word' });

        // Carrega os dados persistidos do Supabase via backend Vercel
        async function carregarBancoDinamico() {
            try {
                const response = await fetch('/api/jisho?acao=listar', {
                    headers: { "Authorization": tokenDeAcesso }
                });
                const resultado = await response.json();

                // TRAVA AUTOMÁTICA DE JWT EXPIRADO:
                if (resultado && resultado.code === "PGRST303") {
                    console.warn("Sessão expirada. Redirecionando para o login...");
                    localStorage.removeItem('supabase_session');
                    window.location.href = "login.html";
                    return;
                }

                if (Array.isArray(resultado)) {
                    bancoDadosDinamico = resultado;
                    renderizarTextosSalvos(resultado);
                } else {
                    console.error("O banco não retornou uma lista. Resposta recebida:", resultado);
                    bancoDadosDinamico = [];
                }
            } catch (e) {
                console.error("Falha ao carregar banco de dados persistente.", e);
                bancoDadosDinamico = [];
            }
        }

        function analisarLinha(linha) {
            if (!linha.trim()) return '<br>';
            let matches = [];

            bancoDadosDinamico.forEach(dado => {
                if (dado && dado.item && dado.categoria !== 'Texto') { // Garante integridade do objeto e não colore textos longos
                    let index = linha.indexOf(dado.item);
                    while (index !== -1) {
                        matches.push({ start: index, end: index + dado.item.length, dado: dado });
                        index = linha.indexOf(dado.item, index + 1);
                    }
                }
            });

            matches.sort((a, b) => (a.start !== b.start ? a.start - b.start : b.end - a.end));

            let validMatches = [];
            let lastEnd = 0;
            for (let m of matches) {
                if (m.start >= lastEnd) {
                    validMatches.push(m);
                    lastEnd = m.end;
                }
            }

            let result = '';
            let curr = 0;

            for (let m of validMatches) {
                let lacuna = linha.substring(curr, m.start);
                if (lacuna) result += processarLacuna(lacuna);
                result += `<span class="termo-destaque aprendido" onclick="exibirDetalhes('${m.dado.item}', this)">${linha.substring(m.start, m.end)}</span>`;
                curr = m.end;
            }

            // CORREÇÃO DA SINTAXE: Removido o '=' duplicado
            let lacunaFinal = linha.substring(curr);
            if (lacunaFinal) result += processarLacuna(lacunaFinal);
            
            const textoEscapado = linha.replace(/"/g, '&quot;');
            return `
                <div class="bloco-linha">
                    <p class="linha-texto">${result}</p>
                    <button class="btn-traduzir-linha" data-texto="${textoEscapado}" onclick="traduzirLinhaCompleta(this)" title="Traduzir linha completa para Português">🌐 Traduzir</button>
                    <div class="traducao-container" style="display: none;"></div>
                </div>
            `;
        }

        function processarLacuna(textoDesconhecido) {
            let html = '';
            const segmentos = segmentador.segment(textoDesconhecido);
            for (let seg of segmentos) {
                if (seg.isWordLike) {
                    html += `<span class="termo-destaque desconhecido" onclick="exibirDesconhecido('${seg.segment}', this)">${seg.segment}</span>`;
                } else {
                    html += seg.segment;
                }
            }
            return html;
        }

        function processarTexto() {
            const rawText = document.getElementById('input-texto').value;
            if (!rawText.trim()) return;

            const linhas = rawText.split('\n');
            const output = document.getElementById('output-texto');
            let htmlFinal = '';
            linhas.forEach(linha => htmlFinal += analisarLinha(linha));
            output.innerHTML = htmlFinal;
        }

        function atualizarDestaqueVisual(elementoSpan) {
            document.querySelectorAll('.termo-destaque.ativo').forEach(el => el.classList.remove('ativo'));
            elementoSpan.classList.add('ativo');
        }

        function exibirDetalhes(termoString, elementoSpan) {
            atualizarDestaqueVisual(elementoSpan);
            const termo = bancoDadosDinamico.find(d => d.item === termoString);
            if (!termo) return;

            document.getElementById('dic-conteudo').innerHTML = `
                <span class="dic-categoria" style="color:var(--learned-color)">✅ Salvo (${termo.categoria})</span>
                <p class="dic-termo">${termo.item}</p>
                <p class="dic-leitura">${termo.leitura}</p>
                <p class="dic-significado">${termo.significado}</p>
                <div class="dic-notas"><strong>Notas:</strong><br>${termo.notas || 'Nenhuma nota registrada.'}</div>
                <button class="btn-processar" style="background-color: var(--primary-color); margin-top: 15px;" onclick="window.TutorIA && window.TutorIA.perguntar('Explique de forma bem resumida e direta o termo: ${termo.item} (${termo.leitura || ''})')">🤖 Perguntar ao Sensei IA</button>
            `;
        }

        async function exibirDesconhecido(termoString, elementoSpan) {
            atualizarDestaqueVisual(elementoSpan);
            const painel = document.getElementById('dic-conteudo');
            painel.innerHTML = `<span class="dic-categoria" style="color:var(--unlearned-color)">⏳ Buscando no Jisho...</span><p class="dic-termo">${termoString}</p>`;

            try {
                const response = await fetch(`/api/jisho?termo=${encodeURIComponent(termoString)}`);
                if (!response.ok) throw new Error();

                const json = await response.json();

                if (json && json.data && json.data.length > 0) {
                    const resultado = json.data[0];
                    const leitura = resultado.japanese[0].reading || termoString;
                    const significados = resultado.senses[0].english_definitions.slice(0, 3).join(', ');

                    painel.innerHTML = `
                        <span class="dic-categoria" style="color:var(--unlearned-color)">❌ Desconhecido</span>
                        <p class="dic-termo">${termoString}</p>
                        <p class="dic-leitura">${leitura}</p>
                        <p class="dic-significado" style="color:var(--unlearned-color); font-size:1.2em;">${significados}</p>
                        <button class="btn-salvar-db" onclick="salvarPalavraDinamica('${termoString}', '${leitura}', '${significados.replace(/'/g, "\\'")}')">📥 Salvar no meu Banco</button>
                        <button class="btn-processar" style="background-color: var(--primary-color); margin-top: 10px;" onclick="window.TutorIA && window.TutorIA.perguntar('Explique de forma bem resumida e direta a palavra: ${termoString} (${leitura})')">🤖 Perguntar ao Sensei IA</button>
                    `;
                } else {
                    throw new Error();
                }
            } catch (e) {
                painel.innerHTML = `<p class="dic-termo">${termoString}</p><p>Não foi possível obter tradução.</p>`;
            }
        }

        async function salvarPalavraDinamica(item, leitura, significado) {
            const botao = document.querySelector('.btn-salvar-db');
            botao.textContent = "💾 Salvando...";
            botao.disabled = true;

            const novoTermo = {
                item,
                leitura,
                significado,
                categoria: 'Vocabulário',
                notas: 'Adicionado via módulo de textos.',
                user_id: idDoUsuarioLogado
            };

            try {
                const response = await fetch('/api/jisho?acao=salvar', {
                    method: 'POST',
                    headers: {
                        "Authorization": tokenDeAcesso,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(novoTermo)
                });

                if (response.ok) {
                    bancoDadosDinamico.push(novoTermo);
                    const spanAtivo = document.querySelector('.termo-destaque.desconhecido.ativo');
                    if (spanAtivo) {
                        spanAtivo.classList.remove('desconhecido');
                        spanAtivo.classList.add('aprendido');
                        spanAtivo.onclick = () => exibirDetalhes(item, spanAtivo);
                    }
                    exibirDetalhes(item, spanAtivo);
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("Erro ao salvar palavra. Verifique as regras do banco.");
                botao.textContent = "📥 Salvar no meu Banco";
                botao.disabled = false;
            }
        }

        function atualizarContador() {
            const texto = document.getElementById('input-texto').value;
            document.getElementById('char-counter').textContent = `${texto.length}/600`;
        }

        async function salvarTextoCompleto() {
            const titulo = document.getElementById('titulo-texto').value.trim();
            const texto = document.getElementById('input-texto').value.trim();

            if (!titulo || !texto) {
                alert("Por favor, preencha o título e o texto.");
                return;
            }

            if (texto.length > 600) {
                alert("O texto excede o limite de 600 caracteres.");
                return;
            }

            const botao = document.querySelector('button[onclick="salvarTextoCompleto()"]');
            botao.textContent = "Salvando...";
            botao.disabled = true;

            const novoTexto = {
                item: titulo,
                leitura: '',
                significado: '',
                categoria: 'Texto',
                notas: texto,
                user_id: idDoUsuarioLogado
            };

            try {
                const response = await fetch('/api/jisho?acao=salvar', {
                    method: 'POST',
                    headers: {
                        "Authorization": tokenDeAcesso,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(novoTexto)
                });

                if (response.ok) {
                    alert("Texto salvo com sucesso!");
                    document.getElementById('titulo-texto').value = '';
                    document.getElementById('input-texto').value = '';
                    atualizarContador();
                    document.getElementById('output-texto').innerHTML = '';
                    carregarBancoDinamico(); // Recarrega a lista para mostrar o novo texto
                } else {
                    throw new Error("Falha ao salvar");
                }
            } catch (e) {
                alert("Erro ao salvar texto no banco.");
            } finally {
                botao.textContent = "Salvar Texto";
                botao.disabled = false;
            }
        }

        function renderizarTextosSalvos(dados) {
            const container = document.getElementById('lista-textos-salvos');
            const textos = dados.filter(d => d.categoria === 'Texto');

            if (textos.length === 0) {
                container.innerHTML = '<p style="color: gray; text-align: center;">Nenhum texto salvo ainda.</p>';
                return;
            }

            container.innerHTML = '';
            textos.forEach(t => {
                const div = document.createElement('div');
                div.style.cssText = "background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 5px; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;";
                div.onmouseover = () => { div.style.borderColor = 'var(--highlight-color)'; };
                div.onmouseout = () => { div.style.borderColor = 'var(--border-color)'; };
                div.onclick = () => { carregarTextoNoEditor(t.item, t.notas); };

                div.innerHTML = `
                    <span style="font-weight: bold; font-size: 1.2em; color: var(--primary-color);">${t.item}</span>
                    <span style="font-size: 0.9em; color: gray;">Abrir 📖</span>
                `;
                container.appendChild(div);
            });
        }

        function carregarTextoNoEditor(titulo, conteudo) {
            document.getElementById('titulo-texto').value = titulo;
            document.getElementById('input-texto').value = conteudo;
            atualizarContador();
            processarTexto();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function traduzirLinhaCompleta(botao) {
            const container = botao.nextElementSibling;
            const textoOriginal = botao.getAttribute('data-texto');

            if (!textoOriginal) return;

            // Se já estiver visível, fecha
            if (container.style.display === 'block') {
                container.style.display = 'none';
                botao.innerHTML = '🌐 Traduzir';
                return;
            }

            // Se já tiver a tradução carregada, apenas abre
            if (container.getAttribute('data-carregado') === 'true') {
                container.style.display = 'block';
                botao.innerHTML = '🙈 Ocultar';
                return;
            }

            botao.innerHTML = '⏳ Traduzindo...';
            botao.disabled = true;

            try {
                const apiKey = localStorage.getItem('gemini_api_key');
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) {
                    headers['X-Gemini-Key'] = apiKey;
                }

                const prompt = `Traduza a seguinte linha de japonês para português brasileiro de forma direta e natural. Retorne APENAS a tradução em português, sem qualquer introdução, explicação ou caractere adicional: "${textoOriginal}"`;

                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        messages: [
                            { role: 'user', parts: [{ text: prompt }] }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro na resposta do servidor');

                const traducao = data.reply.trim().replace(/^"|"$/g, ''); // Limpa aspas extras que a IA possa colocar

                container.innerHTML = `<strong>Tradução:</strong> ${traducao}`;
                container.setAttribute('data-carregado', 'true');
                container.style.display = 'block';
                botao.innerHTML = '🙈 Ocultar';
            } catch (e) {
                console.error(e);
                container.innerHTML = `<span style="color:var(--unlearned-color)">❌ Erro ao traduzir: ${e.message}</span>`;
                container.style.display = 'block';
                botao.innerHTML = '🌐 Traduzir';
            } finally {
                botao.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', carregarBancoDinamico);
    </script>
