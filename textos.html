<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Japonês - Leitura de Textos</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --border-color: #dddddd;
            --learned-color: #2980b9;
            --unlearned-color: #c0392b;
            --nav-bg: #2c3e50;
            --nav-active: #e67e22;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #e0e0e0;
            --border-color: #333333;
            --learned-color: #3498db;
            --unlearned-color: #e74c3c;
            --nav-bg: #34495e;
            --nav-active: #e67e22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-menu a {
            padding: 10px 20px;
            text-decoration: none;
            background: var(--nav-bg);
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .nav-menu a.ativo {
            background: var(--nav-active);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto 20px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        @media (max-width: 800px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .painel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            font-size: 1em;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-processar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-processar:hover {
            background-color: #219653;
        }

        .area-leitura {
            margin-top: 20px;
            line-height: 2;
            font-size: 1.4em;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .linha-texto {
            margin: 0;
            display: inline-block;
        }

        .bloco-linha {
            margin: 0 0 12px 0;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .btn-traduzir-linha {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.75em;
            opacity: 0.5;
            padding: 2px 6px;
            margin-left: 8px;
            color: var(--highlight-color);
            border-radius: 4px;
            transition: 0.2s;
            vertical-align: middle;
        }
        .btn-traduzir-linha:hover {
            opacity: 1;
            background-color: rgba(230, 126, 34, 0.15);
        }
        .traducao-container {
            font-size: 0.8em;
            color: var(--learned-color);
            font-style: italic;
            margin-top: 6px;
            padding: 6px 10px;
            background-color: rgba(41, 128, 185, 0.05);
            border-left: 3px solid var(--learned-color);
            border-radius: 3px;
            line-height: 1.4;
        }

        .termo-destaque {
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
            transition: 0.2s;
            border-radius: 3px;
        }

        .termo-destaque.aprendido {
            color: var(--primary-color);
            border-bottom: 2px solid var(--learned-color);
            background-color: rgba(41, 128, 185, 0.1);
        }

        .termo-destaque.aprendido:hover,
        .termo-destaque.aprendido.ativo {
            background-color: var(--learned-color);
            color: white;
            border-color: transparent;
        }

        .termo-destaque.desconhecido {
            color: var(--primary-color);
            border-bottom: 2px solid var(--unlearned-color);
            background-color: rgba(192, 57, 43, 0.1);
        }

        .termo-destaque.desconhecido:hover,
        .termo-destaque.desconhecido.ativo {
            background-color: var(--unlearned-color);
            color: white;
            border-color: transparent;
        }

        .painel-dicionario {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dic-vazio {
            text-align: center;
            color: gray;
            font-style: italic;
            margin-top: 20px;
        }

        .dic-categoria {
            font-size: 0.8em;
            font-weight: bold;
            color: gray;
            text-transform: uppercase;
        }

        .dic-termo {
            font-size: 3em;
            margin: 0;
            text-align: center;
        }

        .dic-leitura {
            font-size: 1.2em;
            color: gray;
            font-family: monospace;
            text-align: center;
        }

        .dic-significado {
            font-size: 1.5em;
            color: var(--learned-color);
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .dic-notas {
            font-size: 0.9em;
            line-height: 1.5;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn-ver-card {
            background-color: var(--learned-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            display: block;
        }

        .btn-ver-card.externo {
            background-color: var(--unlearned-color);
        }

        .btn-salvar-db {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>Módulo 4: Leitura de Textos</h1>
        <button onclick="toggleTheme()"
            style="padding:5px 10px; cursor:pointer; background:#2c3e50; color:white; border:none; border-radius:5px; font-weight:bold;">🌙
            Tema</button>
    </div>

    <div class="nav-menu">
        <a href="index.html">📚 Vocabulário & Kanji</a>
        <a href="frases.html">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="quiz.html">⚡ Quiz</a>
        <a href="textos.html" class="ativo">📄 Textos</a>
        <a href="srs.html">🧠 SRS</a>
        <a href="dialogo.html">💬 Diálogo</a>
        <a href="anki.html">🎴 Anki</a>
        <a href="perfil.html">👤 Perfil</a>
    </div>

    <div class="layout-grid">
        <div class="painel">
            <h3>Inserir Texto em Japonês</h3>
            <input type="text" id="titulo-texto" placeholder="Nome do texto..." style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color);">
            <textarea id="input-texto" placeholder="Cole aqui a letra de uma música..." maxlength="600" oninput="atualizarContador()"></textarea>
            <div style="text-align: right; font-size: 0.8em; color: gray; margin-bottom: 10px;" id="char-counter">0/600</div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-processar" onclick="processarTexto()">Processar Texto</button>
                <button class="btn-processar" style="background-color: var(--primary-color);" onclick="salvarTextoCompleto()">Salvar Texto</button>
            </div>
            
            <div class="area-leitura" id="output-texto"></div>
        </div>

        <div class="painel painel-dicionario">
            <h3>Dicionário</h3>
            <div id="dic-conteudo">
                <p class="dic-vazio">Clique em um termo destacado no texto para ver os detalhes.</p>
            </div>
        </div>
    </div>

    <div class="layout-grid" style="margin-top: 20px; grid-template-columns: 1fr;">
        <div class="painel">
            <h3>Textos Salvos</h3>
            <div id="lista-textos-salvos" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: gray; text-align: center;">Carregando textos...</p>
            </div>
        </div>
    </div>

    <script>
        // --- CONTROLE DE LOGIN OBRIGATÓRIO ---
        const sessaoLocalStorage = localStorage.getItem('supabase_session');
        if (!sessaoLocalStorage) {
            window.location.href = "login.html"; // Redireciona se não tiver logado
        } else if (!localStorage.getItem('ia_preference')) {
            window.location.href = "setup.html"; // Força setup da IA
        }
        const sessao = JSON.parse(sessaoLocalStorage);
        const tokenDeAcesso = `Bearer ${sessao.access_token}`;
        const idDoUsuarioLogado = sessao.user.id;

        if (localStorage.getItem('tema') !== 'light') document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.toggleAttribute('data-theme', !isDark);
            localStorage.setItem('tema', isDark ? 'light' : 'dark');
        }

        function extrairConjuntos(notas) {
            let conjuntos = [];
            if (notas) {
                const match = notas.match(/\[Conjuntos:\s*([^\]]+)\]/);
                if (match) {
                    conjuntos = match[1].split(',').map(s => s.trim()).filter(s => s.length > 0);
                }
            }
            if (!conjuntos.includes('Geral')) {
                conjuntos.unshift('Geral');
            }
            return conjuntos;
        }

        function removerTagConjuntos(notas) {
            if (!notas) return '';
            return notas.replace(/\s*\[Conjuntos:\s*([^\]]+)\]/, '').trim();
        }

        function formatarNotasHTML(notas) {
            if (!notas) return '<p style="color: gray; font-style: italic; margin: 5px 0;">Nenhuma nota registrada.</p>';
            
            const linhas = notas.split('\n');
            let html = '';
            
            let exemplo = '';
            let furigana = '';
            let traducao = '';
            let outrasNotas = [];
            
            linhas.forEach(linha => {
                const trimmed = linha.trim();
                if (!trimmed) return;
                
                let label = '';
                let conteudo = '';
                const idxDoisPontos = trimmed.indexOf(':');
                if (idxDoisPontos !== -1) {
                    label = trimmed.substring(0, idxDoisPontos).trim();
                    conteudo = trimmed.substring(idxDoisPontos + 1).trim();
                } else {
                    conteudo = trimmed;
                }

                const temJapones = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(conteudo || trimmed);
                const temFurigana = temJapones && /\[[^\]]+\]/.test(conteudo || trimmed);

                if (temFurigana) {
                    furigana = conteudo || trimmed;
                } else if (temJapones && (label === 'Exemplo' || label === 'Frase' || !label)) {
                    exemplo = conteudo || trimmed;
                } else if (label === 'Tradução') {
                    const contemJap = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(conteudo);
                    if (contemJap) {
                        exemplo = conteudo;
                    } else {
                        traducao = conteudo;
                    }
                } else if (label === 'Gramática' || label === 'Notas') {
                    const contemFur = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(conteudo) && /\[[^\]]+\]/.test(conteudo);
                    if (contemFur) {
                        furigana = conteudo;
                    } else {
                        outrasNotas.push(conteudo);
                    }
                } else {
                    if (!temJapones && !traducao) {
                        traducao = trimmed;
                    } else {
                        outrasNotas.push(trimmed);
                    }
                }
            });

            const converterParaRuby = (texto) => {
                if (!texto) return '';
                const semRotulo = texto.replace(/^(Furigana|Pronúncia|Gramática|Exemplo|Frase|Tradução|Notas):\s*/i, '');
                return semRotulo.replace(/([\u4E00-\u9FFF]+)\[([^\]]+)\]/g, '<ruby>$1<rt style="font-size: 0.55em; color: var(--highlight-color); font-weight: normal;">$2</rt></ruby>');
            };

            const limparTextoJapones = (texto) => {
                if (!texto) return '';
                return texto.replace(/^(Exemplo|Frase|Tradução|Notas):\s*/i, '');
            };

            if (exemplo || furigana) {
                html += `
                    <div class="nota-exemplo-bloco" style="margin-top: 10px; background: rgba(120, 120, 120, 0.05); border-left: 3px solid var(--highlight-color); padding: 10px 14px; border-radius: 6px; box-sizing: border-box;">
                        <div style="font-size: 0.75em; text-transform: uppercase; color: gray; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;">Frase de Exemplo</div>
                `;
                
                if (furigana) {
                    html += `
                        <div style="font-family: 'Noto Sans JP', sans-serif; font-size: 1.25em; font-weight: 700; line-height: 1.6; color: var(--text-color); margin-bottom: 4px; letter-spacing: 0.5px;">
                            ${converterParaRuby(furigana)}
                        </div>
                    `;
                } else if (exemplo) {
                    html += `
                        <div style="font-family: 'Noto Sans JP', sans-serif; font-size: 1.2em; font-weight: 700; line-height: 1.5; color: var(--text-color); margin-bottom: 4px;">
                            ${limparTextoJapones(exemplo)}
                        </div>
                    `;
                }

                if (traducao) {
                    html += `
                        <div style="font-size: 0.9em; font-style: italic; color: var(--text-color); margin-top: 8px; border-top: 1px dashed rgba(120,120,120,0.15); padding-top: 6px; opacity: 0.9;">
                            ${traducao}
                        </div>
                    `;
                }
                html += `</div>`;
            } else {
                if (traducao) {
                    html += `
                        <div style="margin-top: 8px; font-size: 0.95em; line-height: 1.4;">
                            <strong style="color: var(--highlight-color);">Tradução:</strong> ${traducao}
                        </div>
                    `;
                }
            }

            if (outrasNotas.length > 0) {
                const notasTratadas = outrasNotas.map(n => {
                    const limpa = n.replace(/^(Notas|Gramática):\s*/i, '');
                    return converterParaRuby(limpa);
                }).filter(n => n.length > 0);

                if (notasTratadas.length > 0) {
                    html += `
                        <div class="nota-adicional-bloco" style="margin-top: 10px; font-size: 0.88em; line-height: 1.4; border-top: 1px solid var(--border-color); padding-top: 8px;">
                            <div style="font-size: 0.75em; text-transform: uppercase; color: gray; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;">Notas de Gramática</div>
                            <div style="color: var(--text-color); opacity: 0.85; white-space: pre-wrap;">${notasTratadas.join('\n')}</div>
                        </div>
                    `;
                }
            }

            return html;
        }

        function atualizarNotasComConjuntos(notasLimpa, conjuntos) {
            if (conjuntos.length === 0) {
                return notasLimpa;
            }
            const tag = `[Conjuntos: ${conjuntos.join(', ')}]`;
            return notasLimpa ? `${notasLimpa}\n${tag}` : tag;
        }

        function obterStatusTextoAtual() {
            const titulo = document.getElementById('titulo-texto').value.trim();
            if (!titulo) return { salvo: false, nome: '' };
            const existe = bancoDadosDinamico.some(d => d.categoria === 'Texto' && d.item.toLowerCase() === titulo.toLowerCase());
            return { salvo: existe, nome: titulo };
        }

        function toggleNovoConjuntoDic() {
            const select = document.getElementById('dic-conjunto-select');
            const divNovo = document.getElementById('dic-novo-conjunto-div');
            if (select && divNovo) {
                if (select.value === 'novo') {
                    divNovo.style.display = 'block';
                    document.getElementById('dic-novo-conjunto-nome').focus();
                } else {
                    divNovo.style.display = 'none';
                }
            }
        }

        let bancoDadosDinamico = [];
        const segmentador = new Intl.Segmenter('ja-JP', { granularity: 'word' });

        // Carrega os dados persistidos do Supabase via backend Vercel
        async function carregarBancoDinamico() {
            try {
                const response = await fetch('/api/jisho?acao=listar', {
                    headers: { 
                        "Authorization": tokenDeAcesso,
                        "Cache-Control": "no-cache, no-store, must-revalidate",
                        "Pragma": "no-cache",
                        "Expires": "0"
                    },
                    cache: "no-store"
                });
                const resultado = await response.json();

                // TRAVA AUTOMÁTICA DE JWT EXPIRADO:
                if (resultado && resultado.code === "PGRST303") {
                    console.warn("Sessão expirada. Redirecionando para o login...");
                    localStorage.removeItem('supabase_session');
                    window.location.href = "login.html";
                    return;
                }

                if (Array.isArray(resultado)) {
                    bancoDadosDinamico = resultado;
                    renderizarTextosSalvos(resultado);
                } else {
                    console.error("O banco não retornou uma lista. Resposta recebida:", resultado);
                    bancoDadosDinamico = [];
                }
            } catch (e) {
                console.error("Falha ao carregar banco de dados persistente.", e);
                bancoDadosDinamico = [];
            }
        }

        function analisarLinha(linha) {
            if (!linha.trim()) return '<br>';
            let matches = [];

            bancoDadosDinamico.forEach(dado => {
                if (dado && dado.item && dado.categoria !== 'Texto') { // Garante integridade do objeto e não colore textos longos
                    let index = linha.indexOf(dado.item);
                    while (index !== -1) {
                        matches.push({ start: index, end: index + dado.item.length, dado: dado });
                        index = linha.indexOf(dado.item, index + 1);
                    }
                }
            });

            matches.sort((a, b) => (a.start !== b.start ? a.start - b.start : b.end - a.end));

            let validMatches = [];
            let lastEnd = 0;
            for (let m of matches) {
                if (m.start >= lastEnd) {
                    validMatches.push(m);
                    lastEnd = m.end;
                }
            }

            let result = '';
            let curr = 0;
            for (let m of validMatches) {
                let lacuna = linha.substring(curr, m.start);
                if (lacuna) result += processarLacuna(lacuna);
                result += `<span class="termo-destaque aprendido" onclick="irParaCard('${m.dado.item.replace(/'/g, "\\'")}')">${linha.substring(m.start, m.end)}</span>`;
                curr = m.end;
            }

            // CORREÇÃO DA SINTAXE: Removido o '=' duplicado
            let lacunaFinal = linha.substring(curr);
            if (lacunaFinal) result += processarLacuna(lacunaFinal);
            
            const textoEscapado = linha.replace(/"/g, '&quot;');
            return `
                <div class="bloco-linha">
                    <p class="linha-texto">${result}</p>
                    <button class="btn-traduzir-linha" data-texto="${textoEscapado}" onclick="traduzirLinhaCompleta(this)" title="Traduzir linha completa para Português">🌐 Traduzir</button>
                    <button class="btn-traduzir-linha" data-texto="${textoEscapado}" onclick="perguntarLinhaSensei(this)" style="color: var(--primary-color);" title="Perguntar ao Sensei sobre esta linha">🤖 Sensei</button>
                    <div class="traducao-container" style="display: none;"></div>
                </div>
            `;
        }

        function processarLacuna(textoDesconhecido) {
            let html = '';
            const segmentos = segmentador.segment(textoDesconhecido);
            for (let seg of segmentos) {
                if (seg.isWordLike) {
                    html += `<span class="termo-destaque desconhecido" onclick="exibirDesconhecido('${seg.segment}', this)">${seg.segment}</span>`;
                } else {
                    html += seg.segment;
                }
            }
            return html;
        }

        function processarTexto() {
            const rawText = document.getElementById('input-texto').value;
            if (!rawText.trim()) return;

            const linhas = rawText.split('\n');
            const output = document.getElementById('output-texto');
            let htmlFinal = '';
            linhas.forEach(linha => htmlFinal += analisarLinha(linha));
            output.innerHTML = htmlFinal;
        }

        function atualizarDestaqueVisual(elementoSpan) {
            document.querySelectorAll('.termo-destaque.ativo').forEach(el => el.classList.remove('ativo'));
            elementoSpan.classList.add('ativo');
        }

        function irParaCard(termo) {
            window.location.href = `index.html?termo=${encodeURIComponent(termo)}`;
        }

        function exibirDetalhes(termoString, elementoSpan) {
            atualizarDestaqueVisual(elementoSpan);
            const termo = bancoDadosDinamico.find(d => d.item === termoString);
            if (!termo) return;

            const conjuntos = extrairConjuntos(termo.notas);
            const notasLimpa = removerTagConjuntos(termo.notas || '');
            
            const conjuntosExibicao = conjuntos.filter(c => c !== 'Geral');
            const badgesHtml = conjuntosExibicao.length > 0 
                ? `<div style="margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap;">${conjuntosExibicao.map(c => `<span style="background-color: var(--nav-active); color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85em;">${c}</span>`).join('')}</div>`
                : '';

            document.getElementById('dic-conteudo').innerHTML = `
                <span class="dic-categoria" style="color:var(--learned-color)">✅ Salvo (${termo.categoria})</span>
                ${badgesHtml}
                <p class="dic-termo">${termo.item}</p>
                <p class="dic-leitura">${termo.leitura}</p>
                <p class="dic-significado">${termo.significado}</p>
                <div class="dic-notes" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px;">${formatarNotasHTML(notasLimpa)}</div>
                <button class="btn-processar" style="background-color: var(--primary-color); margin-top: 15px;" onclick="window.TutorIA && window.TutorIA.perguntar('Explique de forma bem resumida e direta o termo: ${termo.item} (${termo.leitura || ''})')">🤖 Perguntar ao Sensei IA</button>
                <button class="btn-ver-card" style="width: 100%; margin-top: 10px;" onclick="irParaCard('${termo.item.replace(/'/g, "\\'")}')">📖 Ver Card do Termo</button>
            `;
        }

        async function exibirDesconhecido(termoString, elementoSpan) {
            atualizarDestaqueVisual(elementoSpan);
            const painel = document.getElementById('dic-conteudo');
            painel.innerHTML = `<span class="dic-categoria" style="color:var(--unlearned-color)">⏳ Buscando no Jisho...</span><p class="dic-termo">${termoString}</p>`;

            try {
                const response = await fetch(`/api/jisho?termo=${encodeURIComponent(termoString)}`);
                if (!response.ok) throw new Error();

                const json = await response.json();

                if (json && json.data && json.data.length > 0) {
                    const resultado = json.data[0];
                    const leitura = resultado.japanese[0].reading || termoString;
                    const significados = resultado.senses[0].english_definitions.slice(0, 3).join(', ');

                    // 1. Obter todos os conjuntos atualmente existentes no banco
                    const conjuntosExistentes = new Set(['Geral']);
                    bancoDadosDinamico.forEach(d => {
                        if (d.categoria && d.categoria !== 'Texto' && !d.categoria.startsWith('Frase:')) {
                            const conjuntos = extrairConjuntos(d.notas);
                            conjuntos.forEach(c => conjuntosExistentes.add(c));
                        }
                    });

                    // 2. Verificar se o texto atual está salvo no banco
                    const statusTexto = obterStatusTextoAtual();

                    // 3. Montar as opções do select
                    let selectHtml = '';
                    if (statusTexto.salvo) {
                        selectHtml += `<option value="${statusTexto.nome}" selected>📁 Pasta do Texto: ${statusTexto.nome}</option>`;
                    }
                    
                    Array.from(conjuntosExistentes).forEach(c => {
                        if (!statusTexto.salvo || c.toLowerCase() !== statusTexto.nome.toLowerCase()) {
                            selectHtml += `<option value="${c}">${c}</option>`;
                        }
                    });
                    selectHtml += `<option value="novo">➕ Criar Novo Conjunto...</option>`;

                    painel.innerHTML = `
                        <span class="dic-categoria" style="color:var(--unlearned-color)">❌ Desconhecido</span>
                        <p class="dic-termo">${termoString}</p>
                        <p class="dic-leitura">${leitura}</p>
                        <p class="dic-significado" style="color:var(--unlearned-color); font-size:1.2em;">${significados}</p>
                        
                        <div style="margin: 15px 0; text-align: left; background: var(--bg-color); padding: 10px; border-radius: 5px; border: 1px solid var(--border-color); box-sizing: border-box;">
                            <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; color: var(--text-color);">📁 Salvar no Conjunto:</label>
                            <select id="dic-conjunto-select" onchange="toggleNovoConjuntoDic()" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--card-bg); color: var(--text-color); font-weight: bold; cursor: pointer; outline: none; box-sizing: border-box;">
                                ${selectHtml}
                            </select>
                            <div id="dic-novo-conjunto-div" style="display: none; margin-top: 8px;">
                                <input type="text" id="dic-novo-conjunto-nome" placeholder="Nome do novo conjunto..." style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--card-bg); color: var(--text-color); outline: none; box-sizing: border-box;">
                            </div>
                        </div>

                        <button class="btn-salvar-db" onclick="salvarPalavraDinamica('${termoString}', '${leitura}', '${significados.replace(/'/g, "\\'")}')">📥 Salvar no meu Banco</button>
                        <button class="btn-processar" style="background-color: var(--primary-color); margin-top: 10px;" onclick="window.TutorIA && window.TutorIA.perguntar('Explique de forma bem resumida e direta a palavra: ${termoString} (${leitura})')">🤖 Perguntar ao Sensei IA</button>
                    `;
                } else {
                    throw new Error();
                }
            } catch (e) {
                painel.innerHTML = `<p class="dic-termo">${termoString}</p><p>Não foi possível obter tradução.</p>`;
            }
        }

        async function salvarPalavraDinamica(item, leitura, significado) {
            const botao = document.querySelector('.btn-salvar-db');
            const selectConjunto = document.getElementById('dic-conjunto-select');
            let conjuntoFinal = 'Geral';

            if (selectConjunto) {
                if (selectConjunto.value === 'novo') {
                    const inputNovo = document.getElementById('dic-novo-conjunto-nome');
                    const nomeNovo = inputNovo ? inputNovo.value.trim() : '';
                    if (!nomeNovo) {
                        alert("Por favor, digite o nome do novo conjunto.");
                        return;
                    }
                    conjuntoFinal = nomeNovo;
                } else {
                    conjuntoFinal = selectConjunto.value;
                }
            }

            botao.textContent = "💾 Salvando...";
            botao.disabled = true;

            const notasLimpa = 'Adicionado via módulo de textos.';
            const novasNotas = atualizarNotasComConjuntos(notasLimpa, [conjuntoFinal]);

            const novoTermo = {
                item,
                leitura,
                significado,
                categoria: 'Vocabulário',
                notas: novasNotas,
                user_id: idDoUsuarioLogado
            };

            try {
                const response = await fetch('/api/jisho?acao=salvar', {
                    method: 'POST',
                    headers: {
                        "Authorization": tokenDeAcesso,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(novoTermo)
                });

                if (response.ok) {
                    const resultJson = await response.json();
                    const salvoDb = Array.isArray(resultJson) ? resultJson[0] : resultJson;
                    const termoParaInserir = salvoDb || novoTermo;
                    
                    bancoDadosDinamico.push(termoParaInserir);
                    const spanAtivo = document.querySelector('.termo-destaque.desconhecido.ativo');
                    if (spanAtivo) {
                        spanAtivo.classList.remove('desconhecido');
                        spanAtivo.classList.add('aprendido');
                        spanAtivo.onclick = () => irParaCard(item);
                    }
                    exibirDetalhes(item, spanAtivo);
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("Erro ao salvar palavra. Verifique as regras do banco.");
                botao.textContent = "📥 Salvar no meu Banco";
                botao.disabled = false;
            }
        }

        function atualizarContador() {
            const texto = document.getElementById('input-texto').value;
            document.getElementById('char-counter').textContent = `${texto.length}/600`;
        }

        async function salvarTextoCompleto() {
            const titulo = document.getElementById('titulo-texto').value.trim();
            const texto = document.getElementById('input-texto').value.trim();

            if (!titulo || !texto) {
                alert("Por favor, preencha o título e o texto.");
                return;
            }

            if (texto.length > 600) {
                alert("O texto excede o limite de 600 caracteres.");
                return;
            }

            const botao = document.querySelector('button[onclick="salvarTextoCompleto()"]');
            botao.textContent = "Salvando...";
            botao.disabled = true;

            const novoTexto = {
                item: titulo,
                leitura: '',
                significado: '',
                categoria: 'Texto',
                notas: texto,
                user_id: idDoUsuarioLogado
            };

            try {
                const response = await fetch('/api/jisho?acao=salvar', {
                    method: 'POST',
                    headers: {
                        "Authorization": tokenDeAcesso,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(novoTexto)
                });

                if (response.ok) {
                    alert("Texto salvo com sucesso!");
                    document.getElementById('titulo-texto').value = '';
                    document.getElementById('input-texto').value = '';
                    atualizarContador();
                    document.getElementById('output-texto').innerHTML = '';
                    carregarBancoDinamico(); // Recarrega a lista para mostrar o novo texto
                } else {
                    throw new Error("Falha ao salvar");
                }
            } catch (e) {
                alert("Erro ao salvar texto no banco.");
            } finally {
                botao.textContent = "Salvar Texto";
                botao.disabled = false;
            }
        }

        function renderizarTextosSalvos(dados) {
            const container = document.getElementById('lista-textos-salvos');
            const textos = dados.filter(d => d.categoria === 'Texto');

            if (textos.length === 0) {
                container.innerHTML = '<p style="color: gray; text-align: center;">Nenhum texto salvo ainda.</p>';
                return;
            }

            container.innerHTML = '';
            textos.forEach(t => {
                const div = document.createElement('div');
                div.style.cssText = "background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 5px; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;";
                div.onmouseover = () => { div.style.borderColor = 'var(--highlight-color)'; };
                div.onmouseout = () => { div.style.borderColor = 'var(--border-color)'; };
                div.onclick = () => { carregarTextoNoEditor(t.item, t.notas); };

                div.innerHTML = `
                    <span style="font-weight: bold; font-size: 1.2em; color: var(--primary-color);">${t.item}</span>
                    <span style="font-size: 0.9em; color: gray;">Abrir 📖</span>
                `;
                container.appendChild(div);
            });
        }

        function carregarTextoNoEditor(titulo, conteudo) {
            document.getElementById('titulo-texto').value = titulo;
            document.getElementById('input-texto').value = conteudo;
            atualizarContador();
            processarTexto();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function traduzirLinhaCompleta(botao) {
            const container = botao.nextElementSibling;
            const textoOriginal = botao.getAttribute('data-texto');

            if (!textoOriginal) return;

            // Se já estiver visível, fecha
            if (container.style.display === 'block') {
                container.style.display = 'none';
                botao.innerHTML = '🌐 Traduzir';
                return;
            }

            // Se já tiver a tradução carregada, apenas abre
            if (container.getAttribute('data-carregado') === 'true') {
                container.style.display = 'block';
                botao.innerHTML = '🙈 Ocultar';
                return;
            }

            botao.innerHTML = '⏳ Traduzindo...';
            botao.disabled = true;

            try {
                const apiKey = localStorage.getItem('gemini_api_key');
                const headers = { 'Content-Type': 'application/json' };
                if (apiKey) {
                    headers['X-Gemini-Key'] = apiKey;
                }

                const prompt = `Traduza a seguinte linha de japonês para português brasileiro de forma direta e natural. Retorne APENAS a tradução em português, sem qualquer introdução, explicação ou caractere adicional: "${textoOriginal}"`;

                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        messages: [
                            { role: 'user', parts: [{ text: prompt }] }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro na resposta do servidor');

                const traducao = data.reply.trim().replace(/^"|"$/g, ''); // Limpa aspas extras que a IA possa colocar

                container.innerHTML = `<strong>Tradução:</strong> ${traducao}`;
                container.setAttribute('data-carregado', 'true');
                container.style.display = 'block';
                botao.innerHTML = '🙈 Ocultar';
            } catch (e) {
                console.error(e);
                container.innerHTML = `<span style="color:var(--unlearned-color)">❌ Erro ao traduzir: ${e.message}</span>`;
                container.style.display = 'block';
                botao.innerHTML = '🌐 Traduzir';
            } finally {
                botao.disabled = false;
            }
        }

        async function perguntarLinhaSensei(botao) {
            const texto = botao.getAttribute('data-texto');
            if (texto && window.TutorIA) {
                window.TutorIA.perguntar(`Explique a estrutura gramatical, partículas e nuances da frase: "${texto}"`);
            }
        }

        window.addEventListener('DOMContentLoaded', carregarBancoDinamico);
    </script>
    <script src="tutor-ia.js"></script>
</body>

</html>
