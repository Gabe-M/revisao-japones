<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Japonês - Vocabulário</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --text-color: #333; --card-bg: #ffffff;
            --primary-color: #2c3e50; --secondary-color: #34495e;
            --border-color: #dddddd; --highlight-color: #e67e22;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e;
            --primary-color: #34495e; --secondary-color: #4b6584;
            --border-color: #333333; --highlight-color: #d35400;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s; }
        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-menu a { padding: 10px 20px; text-decoration: none; background: var(--primary-color); color: white; border-radius: 5px; font-weight: bold; }
        .nav-menu a.ativo { background: var(--highlight-color); }
        .header-container { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto 20px; }
        .search-bar { width: 100%; max-width: 500px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); margin: 0 auto 20px; display: block; outline: none; }
        .search-bar:focus { border-color: var(--highlight-color); }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto 30px; }
        button { padding: 10px 15px; border: none; background: var(--primary-color); color: white; border-radius: 5px; cursor: pointer; }
        button.active { box-shadow: 0 0 0 3px var(--highlight-color); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .item-title { font-size: 2.2em; text-align: center; margin: 10px 0; }
        details { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); }
        summary { cursor: pointer; font-weight: bold; color: var(--highlight-color); display: none; }
        
        /* NOVO: Estilos de Paginação */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; padding-bottom: 20px; }
        .pagination button { background-color: var(--secondary-color); padding: 8px 15px; font-weight: bold; }
        .pagination button:disabled { background-color: var(--border-color); color: gray; cursor: not-allowed; opacity: 0.6; }
        .page-info { font-weight: bold; font-size: 1.1em; color: var(--text-color); }
        
        /* NOVO: Estilos do Modo Associação */
        .switch input:checked + .slider { background-color: #27ae60; }
        .switch input:checked + .slider:before { transform: translateX(22px); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        .card.associando { border: 2px solid #27ae60 !important; background-color: rgba(39, 174, 96, 0.05) !important; }
        .card.associado-sucesso { animation: pulse-green 0.6s ease-out; }
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(39, 174, 96, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
    </style>
</head>
<body>

    <script src="vocabulario.js"></script>

    <div class="header-container">
        <h1>Módulo 1: Vocabulário Base</h1>
        <button onclick="toggleTheme()" id="themeBtn" style="padding:5px 10px; cursor:pointer;">🌙 Tema</button>
    </div>

    <div class="nav-menu">
        <a href="index.html" class="ativo">📚 Vocabulário & Kanji</a>
        <a href="frases.html">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="textos.html">📄 Textos</a>
    </div>

    <!-- Painel de Organização de Conjuntos -->
    <div class="controls" style="background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); max-width: 1200px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <span style="font-weight: bold; font-size: 1.1em; color: var(--text-color);">🗂️ Organizar em Conjuntos:</span>
            
            <select id="ia-conjunto-select" onchange="toggleNovoConjuntoInput()" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); font-weight: bold; cursor: pointer; outline: none;">
                <!-- Preenchido via JS -->
            </select>
            
            <div id="ia-novo-conjunto-div" style="display: none; align-items: center; gap: 8px;">
                <input type="text" id="ia-novo-conjunto-nome" placeholder="Novo conjunto..." style="padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); outline: none;">
                <button onclick="criarNovoConjunto()" style="background-color: var(--primary-color); padding: 8px 12px;">Criar</button>
            </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px;">
            <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 22px;">
                <input type="checkbox" id="modo-associacao-chk" onchange="toggleModoAssociacao()" style="opacity: 0; width: 0; height: 0;">
                <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 22px;"></span>
            </label>
            <span id="modo-associacao-label" style="font-weight: bold; color: gray;">Modo Associação Desativado</span>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Pesquisar termo..." onkeyup="aplicarFiltros()">
    
    <div class="controls" id="botoes-filtro">
        <button onclick="mudarCategoria('Todos')" class="active">Todos</button>
        <button onclick="mudarCategoria('Kanji')">Kanjis</button>
        <button onclick="mudarCategoria('Partícula')">Partículas</button>
        <button onclick="mudarCategoria('Verbo')">Verbos</button>
        <button onclick="mudarCategoria('Demonstrativo')">Demonstrativos</button>
        <button onclick="mudarCategoria('Vocabulário')">Vocabulário</button>
    </div>

    <div class="grid-container" id="card-container"></div>
    
    <div class="pagination" id="pagination-controls"></div>

    <script>
        // Cole este bloco no início da tag <script> das suas páginas para controlar o login:
        const sessaoLocalStorage = localStorage.getItem('supabase_session');
        if (!sessaoLocalStorage) {
        window.location.href = "login.html"; // Redireciona se não tiver logado
        }
        const sessao = JSON.parse(sessaoLocalStorage);
        const tokenDeAcesso = `Bearer ${sessao.access_token}`;
        const idDoUsuarioLogado = sessao.user.id;
        if (localStorage.getItem('tema') === 'dark') document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.toggleAttribute('data-theme', !isDark);
            localStorage.setItem('tema', isDark ? 'light' : 'dark');
        }

        // NOVO: Variáveis de estado para a paginação e conjuntos
        let filtroAtual = 'Todos';
        let dadosFiltrados = [];
        let dadosCombinados = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        let modoAssociacaoAtivo = false;
        let categoriasDisponiveis = ['Kanji', 'Partícula', 'Verbo', 'Demonstrativo', 'Vocabulário'];

        async function carregarDados() {
            try {
                const response = await fetch('/api/jisho?acao=listar', {
                    headers: { "Authorization": tokenDeAcesso }
                });
                const resultado = await response.json();

                // Trava automática de JWT expirado
                if (resultado && resultado.code === "PGRST303") {
                    console.warn("Sessão expirada. Redirecionando para o login...");
                    localStorage.removeItem('supabase_session');
                    window.location.href = "login.html";
                    return;
                }

                let dadosDb = [];
                if (Array.isArray(resultado)) {
                    dadosDb = resultado;
                }

                // Filtrar os dados dinâmicos
                const dadosDbFiltrados = dadosDb.filter(d => d && d.item && d.categoria !== 'Texto' && !(d.categoria && d.categoria.startsWith('Frase:')));

                // Evitamos duplicados com base na propriedade 'item' (palavra em japonês)
                // Se o item base existe na DB, nós preferimos o da DB (pois pode ter tido a categoria atualizada!)
                const itensDb = new Map(dadosDbFiltrados.map(d => [d.item, d]));
                
                const dadosRevisaoAtualizados = dadosRevisao.map(localItem => {
                    if (itensDb.has(localItem.item)) {
                        const dbItem = itensDb.get(localItem.item);
                        // Removemos do map para que não seja adicionado novamente depois
                        itensDb.delete(localItem.item);
                        return dbItem;
                    }
                    return localItem;
                });

                dadosCombinados = [...dadosRevisaoAtualizados, ...itensDb.values()];

                // Atualiza a lista de categorias disponíveis
                const sets = new Set(['Kanji', 'Partícula', 'Verbo', 'Demonstrativo', 'Vocabulário']);
                dadosCombinados.forEach(d => {
                    if (d.categoria && d.categoria !== 'Texto' && !d.categoria.startsWith('Frase:')) {
                        sets.add(d.categoria);
                    }
                });
                categoriasDisponiveis = Array.from(sets);

                atualizarSeletoresDeConjunto();
                atualizarBotoesFiltro();

            } catch (e) {
                console.error("Erro ao buscar dados do banco, usando dados locais.", e);
                dadosCombinados = [...dadosRevisao];
                atualizarSeletoresDeConjunto();
                atualizarBotoesFiltro();
            }
        }

        function atualizarSeletoresDeConjunto() {
            const select = document.getElementById('ia-conjunto-select');
            const currentVal = select.value;
            
            select.innerHTML = categoriasDisponiveis.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            select.innerHTML += `<option value="novo">Criar Novo Conjunto...</option>`;

            if (categoriasDisponiveis.includes(currentVal)) {
                select.value = currentVal;
            } else {
                select.value = 'Vocabulário';
            }
        }

        function atualizarBotoesFiltro() {
            const container = document.getElementById('botoes-filtro');
            container.innerHTML = `<button onclick="mudarCategoria('Todos')" class="${filtroAtual === 'Todos' ? 'active' : ''}">Todos</button>` +
                categoriasDisponiveis.map(cat => {
                    let label = cat;
                    if (cat === 'Kanji') label = 'Kanjis';
                    if (cat === 'Partícula') label = 'Partículas';
                    if (cat === 'Verbo') label = 'Verbos';
                    if (cat === 'Demonstrativo') label = 'Demonstrativos';
                    if (cat === 'Vocabulário') label = 'Vocabulário';
                    return `<button onclick="mudarCategoria('${cat}')" class="${filtroAtual === cat ? 'active' : ''}">${label}</button>`;
                }).join('');
        }

        function toggleModoAssociacao() {
            const chk = document.getElementById('modo-associacao-chk');
            const label = document.getElementById('modo-associacao-label');
            modoAssociacaoAtivo = chk.checked;
            
            if (modoAssociacaoAtivo) {
                label.textContent = "Modo Associação ATIVO 🟢";
                label.style.color = "#27ae60";
                document.querySelectorAll('.card').forEach(c => c.classList.add('associando'));
            } else {
                label.textContent = "Modo Associação Desativado";
                label.style.color = "gray";
                document.querySelectorAll('.card').forEach(c => c.classList.remove('associando'));
            }
        }

        function toggleNovoConjuntoInput() {
            const select = document.getElementById('ia-conjunto-select');
            const divNovo = document.getElementById('ia-novo-conjunto-div');
            if (select.value === 'novo') {
                divNovo.style.display = 'flex';
                document.getElementById('ia-novo-conjunto-nome').focus();
            } else {
                divNovo.style.display = 'none';
            }
        }

        function criarNovoConjunto() {
            const nomeInput = document.getElementById('ia-novo-conjunto-nome');
            const nome = nomeInput.value.trim();
            if (!nome) {
                alert("Por favor, digite um nome para o conjunto.");
                return;
            }

            if (nome === 'Texto' || nome.startsWith('Frase:') || nome === 'Todos') {
                alert("Nome de conjunto reservado ou inválido.");
                return;
            }

            if (!categoriasDisponiveis.includes(nome)) {
                categoriasDisponiveis.push(nome);
                atualizarSeletoresDeConjunto();
                atualizarBotoesFiltro();
            }
            
            const select = document.getElementById('ia-conjunto-select');
            select.value = nome;
            toggleNovoConjuntoInput();
            nomeInput.value = '';
            
            const chk = document.getElementById('modo-associacao-chk');
            chk.checked = true;
            toggleModoAssociacao();
        }

        async function gerenciarCliqueCard(elementoCard, termoObj, event) {
            if (modoAssociacaoAtivo) {
                event.preventDefault();
                event.stopPropagation();
                
                const conjuntoSelecionado = document.getElementById('ia-conjunto-select').value;
                if (conjuntoSelecionado === 'novo') {
                    alert("Crie ou selecione um conjunto primeiro.");
                    return;
                }

                elementoCard.style.opacity = '0.6';
                
                try {
                    let idDoTermo = termoObj.id;
                    
                    if (idDoTermo) {
                        const response = await fetch(`/api/jisho?acao=atualizar&id=${idDoTermo}`, {
                            method: 'PATCH',
                            headers: {
                                "Authorization": tokenDeAcesso,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ categoria: conjuntoSelecionado })
                        });
                        if (!response.ok) throw new Error();
                    } else {
                        const novoTermo = {
                            item: termoObj.item,
                            leitura: termoObj.leitura,
                            significado: termoObj.significado,
                            categoria: conjuntoSelecionado,
                            notas: termoObj.notas || 'Termo base associado.',
                            user_id: idDoUsuarioLogado
                        };
                        
                        const response = await fetch('/api/jisho?acao=salvar', {
                            method: 'POST',
                            headers: {
                                "Authorization": tokenDeAcesso,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(novoTermo)
                        });
                        if (!response.ok) throw new Error();
                        const salvo = await response.json();
                        idDoTermo = Array.isArray(salvo) ? salvo[0]?.id : salvo.id;
                    }

                    const index = dadosCombinados.findIndex(d => d.item === termoObj.item);
                    if (index !== -1) {
                        dadosCombinados[index].categoria = conjuntoSelecionado;
                        if (idDoTermo) dadosCombinados[index].id = idDoTermo;
                        termoObj.categoria = conjuntoSelecionado;
                        termoObj.id = idDoTermo;
                    }

                    elementoCard.style.opacity = '1';
                    elementoCard.querySelector('.card-categoria-label').textContent = conjuntoSelecionado;
                    
                    elementoCard.classList.add('associado-sucesso');
                    setTimeout(() => {
                        elementoCard.classList.remove('associado-sucesso');
                    }, 600);

                } catch (e) {
                    console.error("Falha ao associar termo", e);
                    elementoCard.style.opacity = '1';
                    alert("Erro ao salvar associação no banco de dados.");
                }
            } else {
                const det = elementoCard.querySelector('details');
                det.open = !det.open;
            }
        }

        function mudarCategoria(cat) {
            filtroAtual = cat;
            document.querySelectorAll('#botoes-filtro button').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(`'${cat}'`));
            });
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            dadosFiltrados = dadosCombinados.filter(d => 
                (filtroAtual === 'Todos' || d.categoria === filtroAtual) &&
                (d.item.toLowerCase().includes(texto) || d.leitura.toLowerCase().includes(texto) || d.significado.toLowerCase().includes(texto))
            );
            currentPage = 1;
            renderizarPagina();
        }

        function renderizarPagina() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const dadosPagina = dadosFiltrados.slice(startIndex, endIndex);
            
            renderizarCards(dadosPagina);
            renderizarControlesPaginacao();
        }

        function renderizarControlesPaginacao() {
            const container = document.getElementById('pagination-controls');
            const totalPages = Math.ceil(dadosFiltrados.length / itemsPerPage);
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button onclick="mudarPagina(-1)" ${currentPage === 1 ? 'disabled' : ''}>◄ Anterior</button>
                <span class="page-info">Página ${currentPage} de ${totalPages}</span>
                <button onclick="mudarPagina(1)" ${currentPage === totalPages ? 'disabled' : ''}>Próxima ►</button>
            `;
        }

        function mudarPagina(direcao) {
            currentPage += direcao;
            renderizarPagina();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderizarCards(dados) {
            const container = document.getElementById('card-container');
            if (dados.length === 0) {
                container.innerHTML = `<p style="text-align:center; grid-column: 1 / -1;">Nenhum termo encontrado.</p>`;
                return;
            }

            container.innerHTML = dados.map(d => {
                const termoJson = JSON.stringify(d).replace(/"/g, '&quot;');
                return `
                    <div class="card ${modoAssociacaoAtivo ? 'associando' : ''}" onclick="gerenciarCliqueCard(this, ${termoJson}, event)" style="cursor: pointer;">
                        <div style="display:flex; justify-content:space-between; font-size:0.8em; color:gray; pointer-events: none;">
                            <span class="card-categoria-label">${d.categoria}</span><span>${d.leitura}</span>
                        </div>
                        <p class="item-title" style="pointer-events: none;">${d.item}</p>
                        <details onclick="event.stopPropagation();">
                            <summary>Tradução e Notas</summary>
                            <p style="color:var(--highlight-color); font-weight:bold; margin-top:5px;">${d.significado}</p>
                            <p style="font-size:0.9em; opacity:0.8;">${d.notas}</p>
                            <button style="margin-top: 10px; width: 100%; font-size: 0.9em; background-color: var(--secondary-color);" onclick="event.stopPropagation(); window.TutorIA && window.TutorIA.perguntar('Explique de forma bem resumida e direta a palavra: ${d.item} (${d.leitura})')">🤖 Perguntar ao Sensei IA</button>
                        </details>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', async (event) => {
            await carregarDados();
            
            const urlParams = new URLSearchParams(window.location.search);
            const termoBusca = urlParams.get('termo');
            
            if (termoBusca) {
                const searchInput = document.getElementById('searchInput');
                searchInput.value = termoBusca;
                
                aplicarFiltros();
                
                setTimeout(() => {
                    document.querySelectorAll('.card details').forEach(det => {
                        det.open = true;
                    });
                }, 50);
            } else {
                aplicarFiltros();
            }
        });
    </script>
    <script src="tutor-ia.js"></script>
</body>
</html>
