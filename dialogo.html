<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diálogo e Conversação - Japonês</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        
        /* HEADER & NAVIGATION */
        .header-container { display: flex; justify-content: space-between; max-width: 1200px; margin: 20px auto 30px; align-items: center; padding: 0 20px; }
        .header-container h1 { font-weight: 800; letter-spacing: -0.5px; margin: 0; font-size: 2em; background: linear-gradient(90deg, var(--primary-color), var(--highlight-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        [data-theme="dark"] .header-container h1 { background: linear-gradient(90deg, #ecf0f1, var(--highlight-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; background: var(--card-bg); padding: 8px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); max-width: 900px; margin-left: auto; margin-right: auto; backdrop-filter: blur(10px); }
        .nav-menu a { padding: 10px 20px; text-decoration: none; color: var(--text-color); border-radius: 10px; font-weight: 600; letter-spacing: 0.5px; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; }
        .nav-menu a:hover { background: rgba(0,0,0,0.05); transform: translateY(-2px); }
        [data-theme="dark"] .nav-menu a:hover { background: rgba(255,255,255,0.05); }
        .nav-menu a.ativo { background: var(--highlight-color); color: white; box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3); }

        #root { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Diálogo Interativo</h1>
        <div style="display:flex; gap:10px; align-items:center;">
            <button id="theme-toggle" style="background:none; border:none; color:var(--text-color); cursor:pointer; font-size:1.2em; padding:8px;">🌙</button>
        </div>
    </div>
    
    <nav class="nav-menu">
        <a href="index.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
            Vocabulário
        </a>
        <a href="srs.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 10 10 5 10-5"></path><path d="m2 14 10 5 10-5"></path><path d="m2 6 10 5 10-5"></path></svg>
            SRS
        </a>
        <a href="frases.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Frases
        </a>
        <a href="textos.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>
            Textos
        </a>
        <a href="anki.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Anki
        </a>
        <a href="dialogo.html" class="ativo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/></svg>
            Diálogo
        </a>
        <a href="minigame.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"></rect><path d="M12 12h.01"></path><path d="M17 12h.01"></path><path d="M7 12h.01"></path></svg>
            Jogo
        </a>
        <a href="perfil.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Perfil
        </a>
    </nav>

    <div id="root"></div>
    <script type="module" src="/src/dialogo/main.tsx"></script>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        const savedTheme = localStorage.getItem('tema') !== 'light' ? 'dark' : 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('tema', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
