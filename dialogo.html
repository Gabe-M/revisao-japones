<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diálogo e Conversação - Japonês</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5; --text-color: #2c3e50; --card-bg: rgba(255, 255, 255, 0.95);
            --primary-color: #2c3e50; --secondary-color: #34495e;
            --border-color: rgba(0, 0, 0, 0.06); --highlight-color: #e67e22;
            --shadow-subtle: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
            --card-radius: 16px;
        }
        [data-theme="dark"], html[data-theme="dark"], body[data-theme="dark"] {
            --bg-color: #121212; --text-color: #f0f0f0; --card-bg: rgba(30, 30, 30, 0.85);
            --primary-color: #2c3e50; --secondary-color: #4b6584;
            --border-color: rgba(255, 255, 255, 0.08); --highlight-color: #d35400;
            --shadow-subtle: 0 4px 15px rgba(0,0,0,0.3);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.5);
        }

        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        
        /* HEADER & NAVIGATION */
        .header-container { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto 30px; align-items: center; }
        .header-container h1 { font-weight: 800; letter-spacing: -0.5px; margin: 0; font-size: 2em; background: linear-gradient(90deg, var(--primary-color), var(--highlight-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        [data-theme="dark"] .header-container h1 { background: linear-gradient(90deg, #ecf0f1, var(--highlight-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; background: var(--card-bg); padding: 8px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); max-width: 900px; margin-left: auto; margin-right: auto; backdrop-filter: blur(10px); }
        .nav-menu a { padding: 10px 20px; text-decoration: none; color: var(--text-color); border-radius: 10px; font-weight: 600; letter-spacing: 0.5px; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; }
        .nav-menu a:hover { background: rgba(0,0,0,0.05); transform: translateY(-2px); }
        [data-theme="dark"] .nav-menu a:hover { background: rgba(255,255,255,0.05); }
        .nav-menu a.ativo { background: var(--highlight-color); color: white; box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3); }

        .btn-action { background: var(--secondary-color); color: white; padding: 10px 16px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        #root { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Módulo: Diálogo Interativo</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="toggleTheme()" id="themeBtn" class="btn-action" style="background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); font-size: 0.9em; padding: 8px 12px;">🌙 Tema</button>
        </div>
    </div>
    
    <div class="nav-menu">
        <a href="index.html">📚 Vocabulário & Kanji</a>
        <a href="frases.html">💬 Frases Práticas</a>
        <a href="minigame.html">🎮 Minigame</a>
        <a href="quiz.html">⚡ Quiz</a>
        <a href="textos.html">📄 Textos</a>
        <a href="srs.html">🧠 SRS</a>
        <a href="dialogo.html" class="ativo">💬 Diálogo</a>
        <a href="perfil.html">👤 Perfil</a>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/dialogo/main.tsx"></script>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const htmlElement = document.documentElement;
        
        const savedTheme = localStorage.getItem('tema') !== 'light' ? 'dark' : 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        document.body.setAttribute('data-theme', savedTheme);
        themeBtn.textContent = savedTheme === 'dark' ? '☀️ Tema' : '🌙 Tema';

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('tema', newTheme);
            themeBtn.textContent = newTheme === 'dark' ? '☀️ Tema' : '🌙 Tema';
        }
    </script>
</body>
</html>
